<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QEN Prompt Generator · CognitiveLogic</title>
  <link rel="canonical" href="https://cognitivelogic.it/qen-prompt-generator.html">
  <meta name="description" content="Prompt templates per Claude — miglioramenti Manuale QEN Framework v6.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #f0f0f0; font-family: 'Courier Prime', monospace; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    function Copy({ size }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      );
    }

    function Check({ size }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      );
    }

    function Zap({ size, style }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      );
    }

    const prompts = [
      {
        id: 'pr-review',
        title: 'PR Code Review & Improvements',
        category: 'Pull Request',
        shortDesc: 'Analizza la PR e suggerisci miglioramenti',
        prompt: `Analizza questa PR del repository CognitiveLogic2026:

**PR Branch:** feature/qen-manual-v1.0
**File:** docs/MANUALE_TECNICO_OPERATIVO_v1.0.md
**Repo:** https://github.com/CognitiveLogic2026/CognitiveLogic2026.github.io

Il file contiene la documentazione tecnica completa del motore QEN Framework v6.0 (algoritmo proprietario per HoReCa).

**Chiedo a te:**

1. **Code Quality Check:**
   - Struttura markdown è corretta?
   - Tabelle sono ben formattate?
   - Link e formule sono corrette?

2. **Content Gaps:**
   - Quali sezioni mancano?
   - Dove servono esempi concreti?
   - Quali moduli vanno approfonditi?

3. **Compliance & Legal:**
   - È allineato a GDPR Art. 22 + 35?
   - Coverage EU AI Act è completo?
   - Green Claims Directive è ben integrata?

4. **Miglioramenti Suggeriti:**
   - Come renderlo più operativo per sviluppatori?
   - Quali parametri vanno documentati meglio?
   - Come aggiungere esempi di calcolo real-world?

5. **Roadmap v1.1:**
   - Quali aggiunte sono critiche?
   - Quali possono aspettare?
   - Priorità per i prossimi 30 giorni?

Rispondi strutturato, con azioni concrete.`
      },
      {
        id: 'integration-guide',
        title: 'API Integration Guide Generation',
        category: 'Documentation',
        shortDesc: 'Crea guida integrazione API per i 4 agenti',
        prompt: `Basandoti sul MANUALE_TECNICO_OPERATIVO_v1.0.md del motore QEN, genera una **Integration Guide** per sviluppatori che vogliono connettere i 4 agenti QEN al loro sistema:

**Context:**
- 4 Agent Endpoints live: /agents/compliance-auditor, /agents/territorial-mapper, /agents/advisory-council, /agents/intelligence-feed
- Stack: FastAPI + Claude Sonnet 4.6 + JSON graphs
- VPS: Hetzner CAX21 ARM64, port 8000
- Repo: CognitiveLogic2026/CognitiveLogic2026.github.io

**Genera per ogni agente:**

1. **Endpoint Specification**
   - URL + method
   - Required parameters
   - Response schema (JSON example)

2. **Authentication**
   - Header requirements (API key, bearer token)
   - Rate limits
   - Error handling

3. **Code Examples**
   - Python (requests)
   - JavaScript (fetch)
   - cURL

4. **Webhook Integration**
   - Event types
   - Payload structure
   - Retry logic

5. **Testing Checklist**
   - How to test locally
   - Staging environment
   - Production safety checks

Struttura come documento markdown pronto per il repo.`
      },
      {
        id: 'scoring-examples',
        title: 'Real-World Scoring Examples',
        category: 'Operations',
        shortDesc: 'Calcola scoring su 3 case study HoReCa reali',
        prompt: `Crea 3 case studies completi di calcolo QEN Score per operatori HoReCa reali:

**Scenario 1: Ristorante Tradizionale**
- Fornitori locali a 15-30km
- Imballaggi misti (carta + plastica)
- Energia da gas + 30% rinnovabile
- Zero certificazioni Bio
- 8 dipendenti, stipendi equi, 0 ore extra
- 20% scarto organico
- Zero trasparenza (no QR code)
- 100% ingredienti stagionali locali

**Scenario 2: Fast Casual Sostenibile**
- 60% fornitori a <50km
- 100% imballaggi riciclabili + compostabili
- 100% energia rinnovabile
- 5 certificazioni Ecolabel
- 12 dipendenti, gender pay gap 5%, 40 ore formazione/anno
- 8% scarto organico
- QR code trasparenza dati
- 70% ingredienti biologici, 40% locali

**Scenario 3: Albergo Lusso**
- Filiera lunga (70% fornitori > 200km)
- Imballaggi premium, 40% riciclato
- 50% energia rinnovabile
- 3 certificazioni ISO
- 25 dipendenti, gender pay gap 15%, 10 ore formazione/anno
- 18% scarto (buffet)
- Trasparenza parziale
- Ingredienti importati 60%

**Per ogni scenario, calcola:**

1. Score per ogni modulo (0-100)
2. Score finale ponderato
3. Compliance assessment (Green/Yellow/Red)
4. 3 azioni concrete per migliorare
5. Timeline realistica per raggiungere 80+

Presenta come tabella comparativa + narrative insights.`
      },
      {
        id: 'faq-compliance',
        title: 'FAQ: Compliance & Legal',
        category: 'Legal',
        shortDesc: 'FAQ su compliance GDPR + EU AI Act + Green Claims',
        prompt: `Crea una FAQ completa per operatori HoReCa che chiedono "Come il QEN Score tutela la mia compliance?"

**Sezioni richieste:**

1. **Green Claims Directive**
   - Come il QEN score dimostra conformità?
   - Quali moduli coprono quali allegati?
   - Che documentazione serve per audit?

2. **GDPR Art. 22 (Automated Decision Making)**
   - Il QEN score è una decisione automatica?
   - Quali diritti ha l'operatore?
   - Come opporsi a uno score basso?

3. **GDPR Art. 35 (Data Protection Impact Assessment)**
   - È necessaria una DPIA?
   - Quali dati vengono processati?
   - Come vengono protetti?

4. **EU AI Act (Allegati I-III)**
   - Il QEN rientra in "AI Risk"?
   - Quali obblighi di trasparenza?
   - Documentation requirements?

5. **Audit & Verification**
   - Come verificare i dati inseriti?
   - Quali enti esterni audita?
   - Tracciabilità delle modifiche?

6. **Liability & Insurance**
   - Chi è responsabile se il score è sbagliato?
   - Serve assicurazione per le claims?
   - In caso di greenwashing?

7. **Data Retention & Deletion**
   - Per quanto tempo i dati restano?
   - Come richiedere la cancellazione?
   - Backup & disaster recovery?

Tono: professionale, rassicurante, tecnico ma accessibile.`
      },
      {
        id: 'modulo-deep-dive',
        title: 'Deep-Dive: Privacy Module (Modulo 9)',
        category: 'Technical',
        shortDesc: 'Espandi Modulo 9 con dettagli tecnici operativi',
        prompt: `Espandi il Modulo 9 (Integrità Digitale e Privacy) con dettagli tecnici operativi:

**Attualmente il manuale dice:**
- Livello Data Minimization
- Crittografia database
- Assenza Dark Patterns
- Frequenza audit IT
- Punteggio: +30 privacy by design, +30 protocolli avanzati

**Devo espandere con:**

1. **Data Minimization - Specifiche Tecniche**
   - Quali dati sono "superflui"?
   - Lista whitelist dati essenziali per QEN score
   - Come implementare in Python/FastAPI

2. **Encryption Standards**
   - AES-256 vs TLS 1.3?
   - Database encryption (at rest)
   - API encryption (in transit)
   - Key management best practices

3. **Dark Patterns Detection**
   - Quali pattern sono vietati?
   - Come audita automaticamente?
   - Esempi di dark patterns comuni

4. **Audit IT - Checklist**
   - Frequenza (ogni 30gg, 90gg, 365gg?)
   - Chi audita (interno vs esterno)?
   - Strumenti automatici vs manual?
   - Report template

5. **Implementazione FastAPI**
   - Middleware per data minimization
   - Encryption decorator per endpoints
   - Audit logging system
   - Privacy dashboard

6. **Compliance Checklist**
   - GDPR compliance verification
   - ISO 27001 alignment
   - SOC 2 requirements
   - Self-assessment template

Genera come sezione markdown + codice Python di esempio (50-100 linee, split in piccoli file).`
      }
    ];

    function PromptCard({ item }) {
      const [copied, setCopied] = useState(false);

      const copy = () => {
        navigator.clipboard.writeText(item.prompt);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div style={{
          border: '2px solid #d4a574',
          padding: '20px',
          backgroundColor: '#151515',
          display: 'flex',
          flexDirection: 'column',
          gap: '16px'
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start' }}>
            <span style={{
              fontSize: '10px',
              textTransform: 'uppercase',
              letterSpacing: '1px',
              color: '#d4a574',
              fontWeight: 'bold'
            }}>
              {item.category}
            </span>
            <Zap size={16} style={{ color: '#d4a574' }} />
          </div>

          <h3 style={{ fontSize: '16px', margin: '0', color: '#fff', fontWeight: 'bold', lineHeight: '1.4' }}>
            {item.title}
          </h3>

          <p style={{ fontSize: '12px', color: '#bbb', margin: '0', lineHeight: '1.5' }}>
            {item.shortDesc}
          </p>

          <button
            onClick={copy}
            style={{
              padding: '10px 16px',
              fontSize: '12px',
              fontFamily: "'Courier Prime', monospace",
              fontWeight: 'bold',
              color: '#0a0a0a',
              backgroundColor: copied ? '#5cb85c' : '#d4a574',
              border: 'none',
              cursor: 'pointer',
              textTransform: 'uppercase',
              letterSpacing: '1px',
              transition: 'background-color 0.2s ease',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              gap: '8px'
            }}
          >
            {copied ? <><Check size={14} /> COPIATO</> : <><Copy size={14} /> COPIA PROMPT</>}
          </button>

          <details style={{ cursor: 'pointer', marginTop: '8px' }}>
            <summary style={{
              fontSize: '11px',
              color: '#999',
              textTransform: 'uppercase',
              letterSpacing: '1px',
              userSelect: 'none'
            }}>
              Anteprima testo...
            </summary>
            <pre style={{
              fontSize: '10px',
              color: '#666',
              backgroundColor: '#0a0a0a',
              padding: '12px',
              overflow: 'auto',
              maxHeight: '200px',
              margin: '12px 0 0 0',
              fontFamily: "'Courier Prime', monospace",
              lineHeight: '1.4',
              whiteSpace: 'pre-wrap'
            }}>
              {item.prompt.slice(0, 300)}...
            </pre>
          </details>
        </div>
      );
    }

    function App() {
      return (
        <div style={{
          minHeight: '100vh',
          background: 'linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%)',
          color: '#f0f0f0',
          fontFamily: "'Courier Prime', monospace",
          padding: '40px 20px'
        }}>
          <div style={{ maxWidth: '1200px', margin: '0 auto' }}>

            <div style={{ borderBottom: '2px solid #d4a574', paddingBottom: '20px', marginBottom: '40px' }}>
              <h1 style={{
                fontSize: '28px',
                margin: '0 0 10px 0',
                color: '#d4a574',
                fontWeight: 'bold',
                letterSpacing: '2px'
              }}>
                QEN PROMPT GENERATOR
              </h1>
              <p style={{ fontSize: '13px', color: '#999', margin: '0', textTransform: 'uppercase', letterSpacing: '1px' }}>
                Prompt Templates per Claude · Manuale QEN Framework v6.0
              </p>
            </div>

            <div style={{
              display: 'grid',
              gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))',
              gap: '24px',
              marginBottom: '40px'
            }}>
              {prompts.map(item => <PromptCard key={item.id} item={item} />)}
            </div>

            <div style={{
              padding: '24px',
              backgroundColor: '#151515',
              border: '2px solid #555'
            }}>
              <h3 style={{
                fontSize: '14px',
                color: '#d4a574',
                margin: '0 0 12px 0',
                fontWeight: 'bold',
                textTransform: 'uppercase',
                letterSpacing: '1px'
              }}>
                Come usare
              </h3>
              <ol style={{ fontSize: '12px', color: '#bbb', lineHeight: '1.8', margin: '0', paddingLeft: '20px' }}>
                <li>Scegli il prompt che serve</li>
                <li>Clicca <strong>COPIA PROMPT</strong> (si copia negli appunti)</li>
                <li>Apri una chat con Claude</li>
                <li>Incolla il prompt</li>
                <li>Claude genera il contenuto strutturato</li>
                <li>Copia l'output nel file markdown corrispondente</li>
                <li>Commit e push come nuova sezione nel repo</li>
              </ol>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
