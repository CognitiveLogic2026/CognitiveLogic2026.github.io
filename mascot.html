<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CognitiveLogic – AI Mascot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 420px;
      height: 540px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── PARTICLES ─── */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { transform: translateY(0) scale(1);   opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-340px) scale(0.3); opacity: 0; }
    }

    /* ─── BODY BREATHE ─── */
    @keyframes breathe {
      0%,100% { transform: scaleY(1) scaleX(1); }
      50%      { transform: scaleY(1.025) scaleX(0.985); }
    }

    /* ─── HEAD FLOAT ─── */
    @keyframes headFloat {
      0%,100% { transform: translateY(0px); }
      50%      { transform: translateY(-6px); }
    }

    /* ─── EYES BLINK ─── */
    @keyframes blink {
      0%,90%,100% { transform: scaleY(1); }
      95%          { transform: scaleY(0.05); }
    }

    /* ─── ANTENNA PULSE ─── */
    @keyframes antennaPulse {
      0%,100% { filter: drop-shadow(0 0 3px #ff00aa); opacity: 1; }
      50%      { filter: drop-shadow(0 0 12px #ff00aa) drop-shadow(0 0 24px #ff00aa); opacity: 0.7; }
    }

    /* ─── SCANLINE FLICKER ─── */
    @keyframes scanline {
      0%   { transform: translateY(-100%); opacity: 0.15; }
      100% { transform: translateY(100%);  opacity: 0.05; }
    }
    @keyframes screenFlicker {
      0%,97%,100% { opacity: 1; }
      98%          { opacity: 0.6; }
    }

    /* ─── KEYBOARD KEY GLOW ─── */
    @keyframes keyGlow0 { 0%,100%{fill:#1a2a3a;filter:none} 8%,16%{fill:#00f5ff;filter:drop-shadow(0 0 4px #00f5ff)} }
    @keyframes keyGlow1 { 0%,100%{fill:#1a2a3a;filter:none} 12%,20%{fill:#00f5ff;filter:drop-shadow(0 0 4px #00f5ff)} }
    @keyframes keyGlow2 { 0%,100%{fill:#1a2a3a;filter:none} 16%,24%{fill:#00f5ff;filter:drop-shadow(0 0 4px #00f5ff)} }
    @keyframes keyGlow3 { 0%,100%{fill:#1a2a3a;filter:none} 20%,28%{fill:#00f5ff;filter:drop-shadow(0 0 4px #00f5ff)} }
    @keyframes keyGlow4 { 0%,100%{fill:#1a2a3a;filter:none} 24%,32%{fill:#00f5ff;filter:drop-shadow(0 0 4px #00f5ff)} }
    @keyframes keyGlow5 { 0%,100%{fill:#1a2a3a;filter:none} 28%,36%{fill:#00f5ff;filter:drop-shadow(0 0 4px #00f5ff)} }
    @keyframes keyGlow6 { 0%,100%{fill:#1a2a3a;filter:none} 32%,40%{fill:#00f5ff;filter:drop-shadow(0 0 4px #00f5ff)} }
    @keyframes keyGlow7 { 0%,100%{fill:#1a2a3a;filter:none} 36%,44%{fill:#00f5ff;filter:drop-shadow(0 0 4px #00f5ff)} }
    @keyframes keyGlow8 { 0%,100%{fill:#1a2a3a;filter:none} 40%,48%{fill:#00f5ff;filter:drop-shadow(0 0 4px #00f5ff)} }

    /* ─── ARM SWAY ─── */
    @keyframes armSwayL {
      0%,100% { transform: rotate(-4deg); transform-origin: top center; }
      50%      { transform: rotate(4deg);  transform-origin: top center; }
    }
    @keyframes armSwayR {
      0%,100% { transform: rotate(4deg);  transform-origin: top center; }
      50%      { transform: rotate(-4deg); transform-origin: top center; }
    }

    /* ─── PLATFORM GLOW ─── */
    @keyframes platformGlow {
      0%,100% { opacity: 0.5; rx: 60; }
      50%      { opacity: 1;   rx: 72; }
    }

    /* ─── CHEST CL PULSE ─── */
    @keyframes clPulse {
      0%,100% { opacity: 0.8; filter: drop-shadow(0 0 2px #00f5ff); }
      50%      { opacity: 1;   filter: drop-shadow(0 0 8px #00f5ff); }
    }

    /* ─── LABEL ─── */
    .label {
      margin-top: 12px;
      color: #00f5ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-shadow: 0 0 12px #00f5ff, 0 0 24px #00f5ff44;
      animation: labelGlow 3.2s ease-in-out infinite;
    }
    @keyframes labelGlow {
      0%,100% { text-shadow: 0 0 8px #00f5ff, 0 0 20px #00f5ff44; }
      50%      { text-shadow: 0 0 16px #00f5ff, 0 0 40px #00f5ff66, 0 0 60px #00f5ff22; }
    }
    .sublabel {
      margin-top: 4px;
      color: #ff00aa88;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="scene">

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <svg id="robot" xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 240 360" width="300" height="450"
       style="overflow:visible; filter: drop-shadow(0 0 18px #00f5ff22)">

    <defs>
      <!-- Body gradient -->
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1a0a2e"/>
        <stop offset="100%" stop-color="#0d1117"/>
      </linearGradient>
      <!-- Head gradient -->
      <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1e0e38"/>
        <stop offset="100%" stop-color="#0d1117"/>
      </linearGradient>
      <!-- Screen gradient -->
      <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#001a1a"/>
        <stop offset="100%" stop-color="#000d0d"/>
      </linearGradient>
      <!-- Keyboard gradient -->
      <linearGradient id="kbGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0a1520"/>
        <stop offset="100%" stop-color="#060e16"/>
      </linearGradient>
      <!-- Platform glow gradient -->
      <radialGradient id="platformGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
      </radialGradient>
      <!-- Visor screen clip -->
      <clipPath id="screenClip">
        <rect x="83" y="55" width="74" height="40" rx="6"/>
      </clipPath>
      <!-- Body glow filter -->
      <filter id="cyanglow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>

    <!-- ═══════════════════════════════════════════
         PLATFORM GLOW
    ═══════════════════════════════════════════ -->
    <ellipse cx="120" cy="330" rx="60" ry="12" fill="url(#platformGrad)"
      style="animation: platformGlow 3.2s ease-in-out infinite;"/>
    <ellipse cx="120" cy="330" rx="48" ry="7" fill="none"
      stroke="#00f5ff" stroke-width="0.8" opacity="0.3"
      style="animation: platformGlow 3.2s ease-in-out infinite;"/>

    <!-- ═══════════════════════════════════════════
         LEGS & FEET  (static, breathe via torso group)
    ═══════════════════════════════════════════ -->
    <g id="legsGroup">
      <!-- Left leg -->
      <rect x="97" y="268" width="18" height="38" rx="5" fill="url(#bodyGrad)"
        stroke="#00f5ff" stroke-width="0.8" opacity="0.9"/>
      <!-- Left foot -->
      <rect x="90" y="300" width="26" height="14" rx="6" fill="#0d1117"
        stroke="#00f5ff" stroke-width="0.8"/>
      <rect x="92" y="303" width="10" height="5" rx="2" fill="#00f5ff" opacity="0.3"/>

      <!-- Right leg -->
      <rect x="125" y="268" width="18" height="38" rx="5" fill="url(#bodyGrad)"
        stroke="#00f5ff" stroke-width="0.8" opacity="0.9"/>
      <!-- Right foot -->
      <rect x="124" y="300" width="26" height="14" rx="6" fill="#0d1117"
        stroke="#00f5ff" stroke-width="0.8"/>
      <rect x="138" y="303" width="10" height="5" rx="2" fill="#00f5ff" opacity="0.3"/>
    </g>

    <!-- ═══════════════════════════════════════════
         TORSO GROUP  (breathe animation)
    ═══════════════════════════════════════════ -->
    <g id="torsoGroup" style="transform-origin:120px 220px; animation: breathe 3.2s ease-in-out infinite;">

      <!-- Torso body -->
      <rect x="82" y="170" width="76" height="100" rx="14" fill="url(#bodyGrad)"
        stroke="#00f5ff" stroke-width="1.2"/>

      <!-- Torso edge highlight -->
      <rect x="82" y="170" width="76" height="4" rx="2" fill="#00f5ff" opacity="0.15"/>

      <!-- Circuit lines on torso -->
      <line x1="95" y1="185" x2="145" y2="185" stroke="#00f5ff" stroke-width="0.5" opacity="0.25"/>
      <line x1="95" y1="240" x2="145" y2="240" stroke="#00f5ff" stroke-width="0.5" opacity="0.25"/>
      <line x1="120" y1="190" x2="120" y2="238" stroke="#00f5ff" stroke-width="0.5" opacity="0.2"/>

      <!-- "CL" chest logo -->
      <rect x="103" y="192" width="34" height="30" rx="6" fill="#00000066"
        stroke="#00f5ff" stroke-width="1"
        style="animation: clPulse 3.2s ease-in-out infinite;"/>
      <text x="120" y="212" text-anchor="middle" font-family="Orbitron,sans-serif"
        font-size="13" font-weight="900" fill="#00f5ff"
        style="animation: clPulse 3.2s ease-in-out infinite;">CL</text>

      <!-- Belt stripe -->
      <rect x="82" y="256" width="76" height="8" rx="3" fill="#00f5ff" opacity="0.1"
        stroke="#00f5ff" stroke-width="0.6"/>
      <rect x="116" y="256" width="8" height="8" rx="2" fill="#00f5ff" opacity="0.25"/>

      <!-- ── LEFT ARM (sway) ── -->
      <g id="armLeft" style="transform-origin:85px 180px; animation: armSwayL 3.2s ease-in-out infinite;">
        <rect x="64" y="172" width="20" height="66" rx="9" fill="url(#bodyGrad)"
          stroke="#00f5ff" stroke-width="1"/>
        <!-- Left hand -->
        <ellipse cx="74" cy="243" rx="11" ry="10" fill="#0d1117"
          stroke="#00f5ff" stroke-width="1"/>
        <line x1="68" y1="244" x2="80" y2="244" stroke="#00f5ff" stroke-width="0.8" opacity="0.6"/>
        <line x1="74" y1="238" x2="74" y2="250" stroke="#00f5ff" stroke-width="0.8" opacity="0.6"/>
        <!-- Cyan stripe on arm -->
        <rect x="66" y="195" width="16" height="3" rx="1" fill="#00f5ff" opacity="0.3"/>
      </g>

      <!-- ── RIGHT ARM (sway) ── -->
      <g id="armRight" style="transform-origin:155px 180px; animation: armSwayR 3.2s ease-in-out infinite;">
        <rect x="156" y="172" width="20" height="66" rx="9" fill="url(#bodyGrad)"
          stroke="#ff00aa" stroke-width="1"/>
        <!-- Right hand -->
        <ellipse cx="166" cy="243" rx="11" ry="10" fill="#0d1117"
          stroke="#ff00aa" stroke-width="1"/>
        <line x1="160" y1="244" x2="172" y2="244" stroke="#ff00aa" stroke-width="0.8" opacity="0.6"/>
        <line x1="166" y1="238" x2="166" y2="250" stroke="#ff00aa" stroke-width="0.8" opacity="0.6"/>
        <!-- Magenta stripe on arm -->
        <rect x="158" y="195" width="16" height="3" rx="1" fill="#ff00aa" opacity="0.3"/>
      </g>

    </g><!-- /torsoGroup -->

    <!-- ═══════════════════════════════════════════
         KEYBOARD (held at waist)
    ═══════════════════════════════════════════ -->
    <g id="keyboard">
      <!-- Keyboard body -->
      <rect x="70" y="255" width="100" height="30" rx="6" fill="url(#kbGrad)"
        stroke="#00f5ff" stroke-width="1"/>
      <!-- Row 1: 9 keys -->
      <rect class="key" x="74"  y="259" width="8" height="7" rx="2" fill="#1a2a3a"
        style="animation: keyGlow0 2.4s ease-in-out infinite;"/>
      <rect class="key" x="84"  y="259" width="8" height="7" rx="2" fill="#1a2a3a"
        style="animation: keyGlow1 2.4s ease-in-out infinite;"/>
      <rect class="key" x="94"  y="259" width="8" height="7" rx="2" fill="#1a2a3a"
        style="animation: keyGlow2 2.4s ease-in-out infinite;"/>
      <rect class="key" x="104" y="259" width="8" height="7" rx="2" fill="#1a2a3a"
        style="animation: keyGlow3 2.4s ease-in-out infinite;"/>
      <rect class="key" x="114" y="259" width="8" height="7" rx="2" fill="#1a2a3a"
        style="animation: keyGlow4 2.4s ease-in-out infinite;"/>
      <rect class="key" x="124" y="259" width="8" height="7" rx="2" fill="#1a2a3a"
        style="animation: keyGlow5 2.4s ease-in-out infinite;"/>
      <rect class="key" x="134" y="259" width="8" height="7" rx="2" fill="#1a2a3a"
        style="animation: keyGlow6 2.4s ease-in-out infinite;"/>
      <rect class="key" x="144" y="259" width="8" height="7" rx="2" fill="#1a2a3a"
        style="animation: keyGlow7 2.4s ease-in-out infinite;"/>
      <rect class="key" x="154" y="259" width="8" height="7" rx="2" fill="#1a2a3a"
        style="animation: keyGlow8 2.4s ease-in-out infinite;"/>
      <!-- Row 2: spacebar area -->
      <rect x="74"  y="269" width="8"  height="7" rx="2" fill="#1a2a3a" opacity="0.7"/>
      <rect x="84"  y="269" width="8"  height="7" rx="2" fill="#1a2a3a" opacity="0.7"/>
      <rect x="94"  y="269" width="44" height="7" rx="2" fill="#1a2a3a" opacity="0.7"/>
      <rect x="140" y="269" width="8"  height="7" rx="2" fill="#1a2a3a" opacity="0.7"/>
      <rect x="150" y="269" width="8"  height="7" rx="2" fill="#1a2a3a" opacity="0.7"/>
      <rect x="160" y="269" width="6"  height="7" rx="2" fill="#1a2a3a" opacity="0.7"/>
      <!-- Keyboard LED strip -->
      <rect x="70" y="283" width="100" height="2" rx="1" fill="#00f5ff" opacity="0.2"/>
    </g>

    <!-- ═══════════════════════════════════════════
         HEAD GROUP  (float animation)
    ═══════════════════════════════════════════ -->
    <g id="headGroup" style="animation: headFloat 3.2s ease-in-out infinite;">

      <!-- Neck -->
      <rect x="111" y="155" width="18" height="18" rx="4" fill="url(#bodyGrad)"
        stroke="#00f5ff" stroke-width="0.8"/>
      <rect x="114" y="157" width="4"  height="14" rx="2" fill="#00f5ff" opacity="0.2"/>
      <rect x="122" y="157" width="4"  height="14" rx="2" fill="#00f5ff" opacity="0.2"/>

      <!-- Head shell -->
      <rect x="76" y="88" width="88" height="70" rx="20" fill="url(#headGrad)"
        stroke="#00f5ff" stroke-width="1.5"/>

      <!-- Head top highlight -->
      <rect x="80" y="88" width="80" height="3" rx="2" fill="#00f5ff" opacity="0.12"/>

      <!-- ── ANTENNA ── -->
      <line x1="120" y1="88" x2="120" y2="58" stroke="#00f5ff" stroke-width="1.5"
        opacity="0.6"/>
      <!-- Antenna joints -->
      <circle cx="120" cy="75" r="3" fill="#0d1117" stroke="#00f5ff" stroke-width="1"/>
      <!-- Antenna tip (magenta pulse) -->
      <circle cx="120" cy="55" r="5" fill="#ff00aa"
        style="animation: antennaPulse 1.6s ease-in-out infinite;"/>
      <circle cx="120" cy="55" r="2.5" fill="#fff" opacity="0.8"/>

      <!-- ── VISOR SCREEN ── -->
      <rect x="83" y="95" width="74" height="40" rx="6" fill="url(#screenGrad)"
        stroke="#00f5ff" stroke-width="1.5"
        style="animation: screenFlicker 6s ease-in-out infinite;"/>

      <!-- Screen inner frame -->
      <rect x="85" y="97" width="70" height="36" rx="4" fill="none"
        stroke="#00f5ff" stroke-width="0.5" opacity="0.4"/>

      <!-- QEN SCORE text on screen -->
      <text x="120" y="112" text-anchor="middle"
        font-family="'Share Tech Mono',monospace" font-size="7"
        fill="#00f5ff" opacity="0.6"
        style="animation: screenFlicker 6s ease-in-out infinite;">QEN SCORE</text>
      <text x="120" y="125" text-anchor="middle"
        font-family="'Share Tech Mono',monospace" font-size="13" font-weight="bold"
        fill="#00f5ff"
        style="animation: screenFlicker 6s ease-in-out infinite;">87</text>

      <!-- Scanline effect -->
      <rect clip-path="url(#screenClip)" x="83" y="0" width="74" height="8"
        fill="#00f5ff" opacity="0.08"
        style="animation: scanline 1.8s linear infinite;"/>

      <!-- ── EYES (above/below visor — visible as indicator lights) ── -->
      <g style="transform-origin:103px 90px; animation: blink 4s ease-in-out infinite;">
        <ellipse cx="103" cy="90" rx="5" ry="4" fill="#00f5ff"
          style="filter: drop-shadow(0 0 4px #00f5ff);"/>
      </g>
      <g style="transform-origin:137px 90px; animation: blink 4s ease-in-out infinite;">
        <ellipse cx="137" cy="90" rx="5" ry="4" fill="#00f5ff"
          style="filter: drop-shadow(0 0 4px #00f5ff);"/>
      </g>

      <!-- ── SPEAKER GRILLE (mouth) ── -->
      <g opacity="0.7">
        <rect x="97" y="144" width="46" height="10" rx="4" fill="#0a0a14"
          stroke="#00f5ff" stroke-width="0.8"/>
        <line x1="103" y1="147" x2="103" y2="151" stroke="#00f5ff" stroke-width="0.8" opacity="0.6"/>
        <line x1="109" y1="147" x2="109" y2="151" stroke="#00f5ff" stroke-width="0.8" opacity="0.6"/>
        <line x1="115" y1="147" x2="115" y2="151" stroke="#00f5ff" stroke-width="0.8" opacity="0.6"/>
        <line x1="121" y1="147" x2="121" y2="151" stroke="#00f5ff" stroke-width="0.8" opacity="0.6"/>
        <line x1="127" y1="147" x2="127" y2="151" stroke="#00f5ff" stroke-width="0.8" opacity="0.6"/>
        <line x1="133" y1="147" x2="133" y2="151" stroke="#00f5ff" stroke-width="0.8" opacity="0.6"/>
        <line x1="139" y1="147" x2="139" y2="151" stroke="#00f5ff" stroke-width="0.8" opacity="0.6"/>
      </g>

      <!-- Side ear panels -->
      <rect x="62" y="104" width="16" height="26" rx="5" fill="#0d1117"
        stroke="#00f5ff" stroke-width="1"/>
      <rect x="64" y="108" width="5" height="4" rx="1" fill="#00f5ff" opacity="0.4"/>
      <rect x="64" y="115" width="5" height="4" rx="1" fill="#ff00aa" opacity="0.4"/>
      <rect x="64" y="122" width="5" height="4" rx="1" fill="#00f5ff" opacity="0.3"/>

      <rect x="162" y="104" width="16" height="26" rx="5" fill="#0d1117"
        stroke="#ff00aa" stroke-width="1"/>
      <rect x="171" y="108" width="5" height="4" rx="1" fill="#ff00aa" opacity="0.4"/>
      <rect x="171" y="115" width="5" height="4" rx="1" fill="#00f5ff" opacity="0.4"/>
      <rect x="171" y="122" width="5" height="4" rx="1" fill="#ff00aa" opacity="0.3"/>

    </g><!-- /headGroup -->

  </svg>
</div>

<!-- Label -->
<div class="label">CognitiveLogic · AI Agent</div>
<div class="sublabel">cognitivelogic.it &nbsp;|&nbsp; v2.0.26</div>

<script>
  // Generate floating particles
  const container = document.getElementById('particles');
  const colors = ['#00f5ff', '#ff00aa', '#00f5ff', '#00f5ff', '#ff00aa'];
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 2 + Math.random() * 4;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const left = 10 + Math.random() * 80;
    const duration = 4 + Math.random() * 7;
    const delay = Math.random() * 8;
    Object.assign(p.style, {
      width: size + 'px',
      height: size + 'px',
      background: color,
      boxShadow: `0 0 ${size * 2}px ${color}`,
      left: left + '%',
      bottom: '5%',
      animationDuration: duration + 's',
      animationDelay: delay + 's',
    });
    container.appendChild(p);
  }
</script>
</body>
</html>
