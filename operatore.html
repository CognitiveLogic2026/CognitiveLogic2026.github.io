<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operatore QEN — Cognitive Logic</title>
  <link rel="canonical" href="https://cognitivelogic.it/operatore.html">
  <meta name="description" content="Scheda operatore QEN — Cognitive Logic" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #070D1A;
      --navy-2:    #0D1628;
      --navy-3:    #122035;
      --gold:      #C9A84C;
      --gold-dim:  rgba(201,168,76,0.10);
      --gold-line: rgba(201,168,76,0.22);
      --gold-soft: rgba(201,168,76,0.55);
      --text:      #CFC9B8;
      --text-2:    #E8E2D4;
      --muted:     #5A5448;
      --muted-2:   #7A7268;
      --line:      rgba(201,168,76,0.12);
      --red-dim:   rgba(180,60,60,0.15);
      --red-line:  rgba(180,60,60,0.32);
      --red-text:  #C87070;
      --serif:     'Cormorant Garamond', serif;
      --mono:      'DM Mono', monospace;
    }

    html, body {
      background: var(--navy);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      min-height: 100vh;
    }

    /* ── Loading ── */
    .loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      flex-direction: column;
      gap: 16px;
    }
    .loading-ring {
      width: 28px; height: 28px;
      border: 1px solid var(--line);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }

    /* ── Report header ── */
    .report-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      padding: 32px 48px 24px;
      border-bottom: 1px solid var(--line);
      gap: 24px;
    }
    .rh-left  { font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted-2); line-height: 1.9; }
    .rh-left strong { color: var(--gold); display: block; font-weight: 400; margin-bottom: 2px; }
    .rh-center { text-align: center; font-size: 0.55rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .rh-right { text-align: right; font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted-2); line-height: 1.9; }

    /* ── Nav ── */
    nav {
      display: flex;
      align-items: center;
      padding: 0 48px;
      border-bottom: 1px solid var(--line);
      background: rgba(7,13,26,0.97);
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: 44px;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.58rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0 14px;
      border-left: 1px solid var(--line);
      line-height: 44px;
      transition: color 0.2s;
    }
    nav a:first-child { border-left: none; padding-left: 0; }
    nav a:hover { color: var(--gold); }
    .nav-spacer { flex: 1; }

    /* ── Cover ── */
    .cover {
      padding: 60px 48px 44px;
      border-bottom: 1px solid var(--line);
    }
    .cover-eyebrow {
      font-size: 0.55rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
    }
    .cover-title {
      font-family: var(--serif);
      font-size: clamp(2.8rem, 5vw, 5rem);
      font-weight: 300;
      line-height: 0.95;
      color: var(--text-2);
      margin-bottom: 10px;
    }
    .cover-title em { font-style: italic; color: var(--gold-soft); }
    .cover-sub {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1rem;
      color: var(--muted-2);
      margin-top: 12px;
    }
    .cover-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    .badge {
      font-size: 0.52rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 1px solid;
    }
    .badge-stato    { border-color: var(--line); color: var(--muted); }
    .badge-p1       { border-color: var(--gold-line); color: var(--gold); background: var(--gold-dim); }
    .badge-p2       { border-color: var(--line); color: var(--muted-2); }
    .badge-cluster  { border-color: rgba(100,160,200,0.3); color: rgba(130,190,220,0.8); }
    .badge-bolk     { border-color: rgba(201,168,76,0.4); color: var(--gold); }
    .badge-cna      { border-color: rgba(120,180,120,0.3); color: rgba(140,200,140,0.85); }

    /* ── Accordion ── */
    .accordion { border-bottom: 1px solid var(--line); }
    .acc-item  { border-top: 1px solid var(--line); }
    .acc-header {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 18px 48px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
      font-family: var(--mono);
    }
    .acc-header:hover { background: var(--gold-dim); }
    .acc-code  { font-size: 0.52rem; letter-spacing: 0.3em; color: var(--gold); flex-shrink: 0; min-width: 52px; }
    .acc-title { font-family: var(--serif); font-size: 1.1rem; font-weight: 300; color: var(--text-2); flex: 1; }
    .acc-chevron { font-size: 0.65rem; color: var(--muted); flex-shrink: 0; transition: transform 0.2s; }
    .acc-item.open .acc-chevron { transform: rotate(180deg); }
    .acc-body  { display: none; padding: 4px 48px 36px; }
    .acc-item.open .acc-body { display: block; }

    /* ── Placeholder ── */
    .placeholder {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-line);
      margin-top: 12px;
    }
    .placeholder-text { font-family: var(--serif); font-style: italic; font-size: 0.85rem; color: var(--muted-2); }
    .badge-mapping {
      font-size: 0.46rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid var(--gold-line);
      color: var(--gold);
      flex-shrink: 0;
    }

    /* ── Meta grid ── */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px 28px;
      padding: 22px;
      border: 1px solid var(--line);
      background: var(--gold-dim);
      margin-bottom: 20px;
    }
    .meta-key { font-size: 0.52rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .meta-val { font-size: 0.72rem; color: var(--text-2); line-height: 1.4; }

    /* ── Body text ── */
    .q-body { font-size: 0.78rem; line-height: 1.85; color: var(--text); max-width: 720px; margin-bottom: 16px; }

    /* ── Compliance table ── */
    .compliance-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .compliance-table th {
      font-size: 0.52rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--gold-line);
      font-weight: 400;
    }
    .compliance-table td {
      font-size: 0.68rem;
      color: var(--text);
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      line-height: 1.5;
    }
    .compliance-table tr:last-child td { border-bottom: none; }
    .compliance-table tr:hover td { background: var(--gold-dim); }
    .s-nv      { color: var(--muted-2); }
    .s-ok      { color: rgba(120,200,120,0.85); }
    .s-sogg    { color: var(--gold); }
    .s-warn    { color: var(--red-text); }

    /* ── Risk cards ── */
    .risk-cards { display: flex; flex-direction: column; gap: 10px; }
    .risk-card {
      padding: 16px 20px;
      border: 1px solid var(--red-line);
      background: var(--red-dim);
    }
    .risk-card-title { font-size: 0.65rem; font-weight: 500; color: var(--red-text); margin-bottom: 6px; letter-spacing: 0.04em; }
    .risk-card-desc  { font-size: 0.7rem; color: var(--muted-2); line-height: 1.75; }

    /* ── Score panel (Q.1.07) ── */
    .score-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--line);
      margin-bottom: 24px;
    }
    .score-cell { background: var(--navy-2); padding: 22px 20px; }
    .score-cell-label { font-size: 0.52rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
    .score-cell-val   { font-family: var(--serif); font-size: 2rem; font-weight: 300; color: var(--muted-2); margin-bottom: 4px; }
    .score-cell-weight { font-size: 0.55rem; color: var(--muted); letter-spacing: 0.1em; }

    /* ── Synthesis ── */
    .q-synthesis { border-left: 1px solid var(--gold-soft); padding-left: 24px; margin: 0 0 24px; }
    .q-synthesis p {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.05rem;
      color: var(--text);
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .q-synthesis p:last-child { margin-bottom: 0; }

    /* ── 3-col next grid ── */
    .next-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--line); }
    .next-col  { background: var(--navy-2); padding: 20px; }
    .next-col-title {
      font-size: 0.52rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .next-item {
      font-size: 0.65rem;
      color: var(--muted-2);
      line-height: 1.6;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .next-item:last-child { border-bottom: none; margin-bottom: 0; }
    .next-item strong { color: var(--text); font-weight: 400; display: block; }

    /* ── Error ── */
    .error-screen { padding: 80px 48px; text-align: center; }
    .error-screen p { color: var(--muted); font-size: 0.8rem; margin-bottom: 16px; }
    .error-screen a { color: var(--gold); font-size: 0.68rem; letter-spacing: 0.1em; text-decoration: none; }

    /* ── Footer ── */
    footer {
      padding: 22px 48px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.55rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    footer a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--gold); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .report-header { grid-template-columns: 1fr; gap: 6px; padding: 20px; }
      .rh-center, .rh-right { text-align: left; }
      .cover { padding: 40px 20px 32px; }
      nav { padding: 0 20px; }
      .acc-header { padding: 14px 20px; gap: 12px; }
      .acc-body { padding: 4px 20px 24px; }
      .meta-grid { grid-template-columns: 1fr 1fr; }
      .score-panel { grid-template-columns: 1fr; }
      .next-grid { grid-template-columns: 1fr; }
      footer { padding: 20px; flex-direction: column; gap: 8px; text-align: center; }
    }
  </style>
</head>
<body>

<div id="app">
  <div class="loading-screen">
    <div class="loading-ring"></div>
    <div class="loading-text">Loading QEN Report</div>
  </div>
</div>

<script>
const SEED_URL = '/data/operators_seed.json';

const CLUSTER_LABEL = {
  bolkestein:     'Cluster I · Bolkestein 2027',
  horeca_bologna: 'Cluster II · HoReCa Bologna',
  cna_bologna:    'Cluster III · CNA Bologna'
};

const SETTORE_LABEL = {
  balneare:    'Balneare · Demanio marittimo',
  ristorativo: 'Ristorativo · F&B locale',
  alberghiero: 'Alberghiero · Accommodation',
  misto:       'Artigianato / Misto'
};

function today() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function daysTo(dateStr) {
  return Math.ceil((new Date(dateStr) - new Date()) / 864e5);
}

function ph() {
  return `<div class="placeholder">
    <span class="badge-mapping">In fase di mappatura</span>
    <span class="placeholder-text">— In fase di mappatura —</span>
  </div>`;
}

function toggleAcc(id) {
  document.getElementById('acc-' + id).classList.toggle('open');
}

function buildRisks(op) {
  const r = [];

  if (op.cluster === 'bolkestein' && op.compliance.bolkestein === 'soggetto') {
    r.push({
      title: 'Scadenza concessione Bolkestein 2027',
      desc:  `Mancano ${daysTo('2027-12-31')} giorni alla scadenza delle concessioni demaniali marittime. La gara pubblica obbligatoria richiede documentazione verificabile del valore aziendale storico ed etico. Senza un Dossier QEN certificato, l'operatore si presenta alla gara senza evidenza quantificabile del proprio capitale territoriale.`
    });
  }

  if (op.compliance.cin_cir === 'N/V') {
    r.push({
      title: 'CIN/CIR non verificati',
      desc:  'I codici identificativi nazionali delle strutture ricettive non sono stati verificati. La mancata registrazione CIN/CIR implica sanzioni amministrative e incide direttamente sul vettore Vs (peso × 0.40) del QEN Score.'
    });
  }

  if (op.compliance.gdpr === 'N/V') {
    r.push({
      title: 'GDPR non verificato',
      desc:  'La conformità al Regolamento UE 2016/679 non è stata verificata. Per operatori che gestiscono prenotazioni, fidelizzazione clienti o PMS con dati personali, la mancanza di DPA documentato costituisce un gap di compliance rilevante.'
    });
  }

  r.push({
    title: 'Profilo digitale non mappato',
    desc:  "Il livello di innovazione digitale, la presenza online verificabile e l'identità digitale dell'operatore non sono stati rilevati. Impatta il KPI digitale del vettore Vt (peso 0.10 su Vt) e la valutazione Brand Equity (Q.1.03)."
  });

  r.push({
    title: 'Filiera fornitori non documentata',
    desc:  'La percentuale di approvvigionamenti entro 100km (km0) e la tracciabilità fornitori non sono verificate. Gap critico per Green Claim Directive (UE 2024/825) e CSRD — peso rilevante nel vettore Va.'
  });

  return r;
}

function buildNextSteps(op) {
  if (op.cluster === 'bolkestein') {
    return [
      'Verifica titolarità concessione demaniale',
      'Raccolta dati KPI balneare (M1–M6)',
      'Crawl profilo digitale e reputazione online',
      'Avvio Dossier QEN · Bolkestein 2027'
    ];
  }
  if (op.cluster === 'horeca_bologna') {
    return [
      'Audit QEN HoReCa (8 moduli)',
      'Verifica filiera km0 e fornitori locali',
      'Raccolta dati lavoro e welfare aziendale',
      'Mappatura brand equity e recensioni'
    ];
  }
  return [
    'Contatto e assessment CNA Bologna',
    'Audit ECI — Ethical Commerce Index',
    'Verifica certificazioni DOP/IGP/prodotto',
    'Costruzione nodo @Gruppo nel grafo QEN'
  ];
}

function buildNodiQEN(op) {
  const n = [{ label: `@Gruppo ${op.label}`, desc: 'Nodo hub operatore' }];
  if (op.settore === 'alberghiero' || op.settore === 'balneare') {
    n.push({ label: '@Struttura principale', desc: 'da identificare e verificare' });
    n.push({ label: '@Persona titolare',     desc: 'proprietà / gestione' });
  }
  if (op.settore === 'balneare') {
    n.push({ label: '@Concessione demaniale', desc: 'numero / scadenza 2027' });
  }
  if (op.settore === 'alberghiero') {
    n.push({ label: '@PMS sistema', desc: 'stack tecnologico da verificare' });
  }
  if (op.settore === 'ristorativo' || op.settore === 'misto') {
    n.push({ label: '@Prodotto / certificazione', desc: 'DOP / IGP / artigianale' });
  }
  if (op.cna_potenziale) {
    n.push({ label: '@CNA_BOLOGNA', desc: 'associazione potenziale' });
  }
  return n.slice(0, 5);
}

function buildEdgeAttesi(op) {
  const e = [{ label: 'Gruppo → Strutture', desc: '1+ nodi operativi' }];
  if (op.compliance.cin_cir === 'N/V') {
    e.push({ label: 'Strutture → CIN/CIR', desc: 'compliance identificativa' });
  }
  if (op.cluster === 'bolkestein') {
    e.push({ label: 'Struttura → Concessione',  desc: 'demanio marittimo' });
    e.push({ label: 'Gruppo → BOLKESTEIN_2027', desc: 'urgenza normativa' });
  }
  if (op.cluster === 'horeca_bologna' || op.cluster === 'cna_bologna') {
    e.push({ label: 'Struttura → Filiera km0', desc: 'supply chain locale' });
    e.push({ label: 'Gruppo → Territorio BO',  desc: 'radicamento semantico' });
  }
  if (op.cna_potenziale) {
    e.push({ label: 'Operatore → CNA_BOLOGNA', desc: 'associazione / rete' });
  }
  return e.slice(0, 5);
}

function buildSynthesis(op) {
  if (op.cluster === 'bolkestein') {
    return `<p>${op.label} rappresenta una delle categorie a massima urgenza normativa del panorama italiano: quella degli operatori balneari adriatici che entro il 2027 dovranno dimostrare — davanti a una commissione pubblica — il valore storico, etico e territoriale di una presenza che in molti casi risale a decenni.</p>
    <p>Nel paradigma QEN, questa urgenza è un'opportunità: la direttiva Bolkestein non chiede solo conformità, chiede <em>narrazione verificabile</em>. Il QEN Score è la struttura computazionale che converte quella narrazione in evidenza difendibile.</p>`;
  }
  if (op.cluster === 'horeca_bologna') {
    return `<p>${op.label} opera in uno dei contesti HoReCa più ricchi di capitale semantico d'Italia: l'area metropolitana bolognese, dove la tradizione culinaria DOP, la filiera corta emiliana e la densità artigianale costituiscono un vantaggio competitivo raramente documentato in forma computabile.</p>
    <p>Il QEN Framework permette di tradurre questo capitale intangibile in metriche Vs/Va/Vt difendibili — utili per candidature a bandi, partnership con CNA Bologna e posizionamento ESG verso i clienti.</p>`;
  }
  return `<p>${op.label} è un operatore della provincia bolognese con potenziale di associazione CNA e profilo adatto alla certificazione QEN. Il valore dell'artigianato locale, della filiera corta e del radicamento territoriale è la materia prima su cui il framework costruisce lo score.</p>
  <p>La sfida è la stessa per tutti i 16.000 associati CNA Bologna: rendere visibile e misurabile ciò che finora era solo vissuto. Il QEN Score è lo strumento.</p>`;
}

function statusClass(val) {
  if (val === 'N/V')      return 's-nv';
  if (val === 'ok')       return 's-ok';
  if (val === 'soggetto') return 's-sogg';
  return 's-warn';
}

function renderOperatore(op) {
  const cLabel  = CLUSTER_LABEL[op.cluster]  || op.cluster;
  const sLabel  = SETTORE_LABEL[op.settore]  || op.settore;
  const pLabel  = op.priorita === 1 ? 'Priorità 1 · Alta' : 'Priorità 2 · Media';
  const risks   = buildRisks(op);
  const steps   = buildNextSteps(op);
  const nodi    = buildNodiQEN(op);
  const edges   = buildEdgeAttesi(op);
  const synth   = buildSynthesis(op);
  const vsVal   = op.vs_score  != null ? op.vs_score  : 'N/V';
  const vaVal   = op.va_score  != null ? op.va_score  : 'N/V';
  const vtVal   = op.vt_score  != null ? op.vt_score  : ((op.cluster === 'bolkestein' || op.priorita === 1) ? 'stima alta' : 'N/V');
  const scoreVal = op.score_qen != null ? op.score_qen.toFixed(1) : null;

  document.title = `${op.label} — QEN · Cognitive Logic`;

  const titleParts = op.label.split(' ');
  const titleL1    = titleParts.slice(0,2).join(' ');
  const titleL2    = titleParts.slice(2).join(' ') || op.territorio;

  document.getElementById('app').innerHTML = `
    <header class="report-header">
      <div class="rh-left">
        <strong>QEN — Quantum Ethics Network</strong>
        Scheda Operatore · ${cLabel}
      </div>
      <div class="rh-center">Cognitive Logic · cognitivelogic.it</div>
      <div class="rh-right">${today()}<br>Seed v1.0 · ${op.stato_qen.replace(/_/g,' ')}</div>
    </header>

    <nav>
      <a href="index.html">Home</a>
      <a href="operatori.html">← Operatori</a>
      <a href="qen-live.html">QEN Live</a>
      <div class="nav-spacer"></div>
      <a href="operatori.html">↩ Directory</a>
    </nav>

    <section class="cover">
      <div class="cover-eyebrow">Scheda QEN · ${pLabel}</div>
      <h1 class="cover-title">${titleL1}<br><em>${titleL2}</em></h1>
      <p class="cover-sub">${op.territorio} — ${sLabel}</p>

        <span class="badge badge-stato">${op.stato_qen.replace(/_/g,' ')}</span>

    <div class="accordion">

        </button>

          <div class="meta-grid">
            <div><div class="meta-key">Denominazione</div><div class="meta-val">${op.label}</div></div>
            <div><div class="meta-key">Territorio</div><div class="meta-val">${op.territorio}</div></div>
            <div><div class="meta-key">Settore</div><div class="meta-val">${sLabel}</div></div>
            <div><div class="meta-key">Anno fondazione</div><div class="meta-val" ${!op.anno_fondazione?'style="color:var(--muted-2)"':''}>${op.anno_fondazione||'— In fase di mappatura —'}</div></div>
            <div><div class="meta-key">Forma giuridica</div><div class="meta-val" ${!op.forma_giuridica?'style="color:var(--muted-2)"':''}>${op.forma_giuridica||'— In fase di mappatura —'}</div></div>
            <div><div class="meta-key">Titolare / Gruppo</div><div class="meta-val" ${!op.titolare?'style="color:var(--muted-2)"':''}>${op.titolare||'— In fase di mappatura —'}</div></div>

            <div><div class="meta-key">Tipo nodo</div><div class="meta-val" style="color:var(--muted-2)">${op.type}</div></div>

          <p class="q-body">Il nodo semantico nel grafo QEN è <strong style="color:var(--gold)">${op.id}</strong> (tipo: ${op.type}). La fase di approfondimento prevede la scomposizione in nodi figlio: strutture operative, persone chiave, sistemi gestionali e relazioni territoriali documentate.</p>

      <div class="acc-item" id="acc-Q102">

          <span class="acc-chevron">▾</span>
        </button>

            <div><div class="meta-key">Settore</div><div class="meta-val">${sLabel}</div></div>

                <td><strong>GDPR</strong><br><span style="color:var(--muted);font-size:0.6rem">Regolamento UE 2016/679</span></td>

            <div><div class="meta-key">Fornitori locali km0</div><div class="meta-val" ${(!op.fornitori_km0||op.fornitori_km0==='N/V')?'style="color:var(--muted-2)"':''}>${(op.fornitori_km0&&op.fornitori_km0!=='N/V')?op.fornitori_km0:'— In fase di mappatura —'}</div></div>
            <div><div class="meta-key">Reti associative</div><div class="meta-val" style="${op.cna_potenziale ? 'color:rgba(140,200,140,0.85)' : 'color:var(--muted-2)'}">${op.cna_potenziale ? 'CNA Bologna (potenziale)' : '— In fase di mappatura —'}</div></div>

          <span class="acc-title">Segnali di Rischio</span>

        <button class="acc-header" onclick="toggleAcc('Q107')">

        <div class="acc-body">
          <div class="score-panel">

              <div class="score-cell-label">VA · Ambientale</div>

            <div class="score-cell">
              <div class="score-cell-label">VT · Territoriale</div>

              <div class="score-cell-weight">peso × 0.25</div>

          </div>
          ${scoreVal ? `
          <div style="display:flex;align-items:center;gap:28px;padding:16px 20px;border:1px solid var(--gold-line);background:var(--gold-dim);margin-bottom:24px;">
            <div>
              <div class="score-cell-label" style="margin-bottom:4px">QEN Score Stimato</div>
              <div style="font-family:var(--serif);font-size:2.8rem;font-weight:300;color:var(--gold);line-height:1">${scoreVal}</div>

            <div style="font-size:0.62rem;color:var(--muted-2);line-height:2;border-left:1px solid var(--gold-line);padding-left:24px">
              <span style="color:var(--muted)">Formula · QEN = Va×0.35 + Vs×0.40 + Vt×0.25</span><br>
              Va ${vaVal} × 0.35 &nbsp;+&nbsp; Vs ${vsVal} × 0.40 &nbsp;+&nbsp; Vt ${vtVal} × 0.25<br>
              <span style="color:var(--muted);font-size:0.55rem;letter-spacing:0.05em">Stima preliminare — non certificata · richiede audit QEN completo</span>
            </div>
          </div>` : ''}
          <div class="q-synthesis">${synth}</div>
          <div class="next-grid">
            <div class="next-col">
              <div class="next-col-title">Prossimi Passi</div>
              ${steps.map(s => `<div class="next-item">${s}</div>`).join('')}
            </div>
            <div class="next-col">
              <div class="next-col-title">Nodi QEN</div>
              ${nodi.map(n => `<div class="next-item"><strong>${n.label}</strong>${n.desc}</div>`).join('')}
            </div>
            <div class="next-col">
              <div class="next-col-title">Edge Semantici</div>
              ${edges.map(e => `<div class="next-item"><strong>${e.label}</strong>${e.desc}</div>`).join('')}
            </div>
          </div>
        </div>
      </div>

    </div>

    <footer>
      <span>COGNITIVE LOGIC · QEN Framework v1.2</span>
      <span><a href="operatori.html">Directory</a> · <a href="qen-live.html">Grafo Live</a> · <a href="framework.html">Framework</a></span>
    </footer>
  `;
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id) {
    document.getElementById('app').innerHTML = `
      <div class="error-screen">
        <p>Nessun operatore specificato nell'URL.</p>
        <a href="operatori.html">← Torna alla directory operatori</a>
      </div>`;
    return;
  }

  try {
    const resp = await fetch(SEED_URL);
    if (!resp.ok) throw new Error('fetch error');
    const data = await resp.json();
    const op   = data.find(o => o.id === id);

    if (!op) {
      document.getElementById('app').innerHTML = `
        <div class="error-screen">
          <p>Operatore non trovato: <code style="color:var(--gold)">${id}</code></p>
          <a href="operatori.html">← Torna alla directory operatori</a>
        </div>`;
      return;
    }

    renderOperatore(op);
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="error-screen">
        <p>Errore nel caricamento dei dati. Verificare la connessione.</p>
        <a href="operatori.html">← Torna alla directory operatori</a>
      </div>`;
  }
}

init();
</script>
<script src="/js/cookie-banner.js"></script>
