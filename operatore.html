<html lang="it">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report QEN — Cognitive Logic</title>
  <meta name="description" content="Report QEN — Analisi Qualitativa degli Asset · QEN Framework" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #070D1A;
      --navy-2:    #0D1628;
      --gold:      #C9A84C;
      --gold-dim:  rgba(201,168,76,0.10);
      --gold-line: rgba(201,168,76,0.22);
      --gold-soft: rgba(201,168,76,0.55);
      --text:      #CFC9B8;
      --text-2:    #E8E2D4;
      --muted:     #5A5448;
      --muted-2:   #7A7268;
      --line:      rgba(201,168,76,0.12);
      --serif:     'Cormorant Garamond', serif;
      --mono:      'DM Mono', monospace;
    }

    html, body {
      background: var(--navy);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      min-height: 100vh;
    }

    /* ── REPORT HEADER ── */
    .report-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      padding: 36px 56px 28px;
      border-bottom: 1px solid var(--line);
      gap: 24px;
    }

    .rh-left { font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted-2); line-height: 1.9; }
    .rh-left strong { color: var(--gold); display: block; font-weight: 400; }
    .rh-center { text-align: center; font-size: 0.55rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); white-space: nowrap; padding-top: 2px; }
    .rh-right { text-align: right; font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted-2); line-height: 1.9; }

    /* ── NAV ── */
    nav {
      display: flex;
      align-items: center;
      padding: 0 56px;
      border-bottom: 1px solid var(--line);
      background: rgba(7,13,26,0.97);
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: 44px;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.58rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0 14px;
      border-left: 1px solid var(--line);
      line-height: 44px;
      transition: color 0.2s;
    }
    nav a:first-child { border-left: none; padding-left: 0; }
    nav a:hover { color: var(--gold); }
    .nav-spacer { flex: 1; }
    .nav-back {
      font-size: 0.58rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--gold); }

    /* ── COVER ── */
    .cover {
      padding: 80px 56px 64px;
      border-bottom: 1px solid var(--line);
    }

    .cover-eyebrow {
      font-size: 0.58rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 32px;
    }

    .cover-title {
      font-family: var(--serif);
      font-size: clamp(3.5rem, 7vw, 7rem);
      font-weight: 300;
      line-height: 0.92;
      color: var(--text-2);
      margin-bottom: 12px;
    }

    .cover-title em {
      font-style: italic;
      color: var(--gold-soft);
    }

    .cover-sub {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(0.95rem, 1.5vw, 1.2rem);
      color: var(--muted-2);
      margin-top: 20px;
      line-height: 1.6;
    }

    .cover-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 48px;
      margin-top: 48px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
      max-width: 580px;
    }

    .cover-meta-item { }
    .cover-meta-key {
      font-size: 0.52rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .cover-meta-val {
      font-size: 0.72rem;
      color: var(--text);
    }

    /* ── SECTION INTRO ── */
    .section-intro {
      padding: 56px 56px 40px;
      border-bottom: 1px solid var(--line);
    }

    .section-tag {
      font-size: 0.55rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .section-intro h2 {
      font-family: var(--serif);
      font-size: clamp(2rem, 3.5vw, 3.2rem);
      font-weight: 300;
      color: var(--text-2);
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .section-intro h2 em { font-style: italic; }

    .section-topics {
      font-size: 0.62rem;
      color: var(--muted-2);
      letter-spacing: 0.12em;
      margin-top: 14px;
    }

    /* ── Q-BLOCK ── */
    .q-block {
      padding: 48px 56px;
      border-bottom: 1px solid var(--line);
    }

    .q-label {
      font-size: 0.52rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }

    .q-heading {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 2.8vw, 2.4rem);
      font-weight: 300;
      color: var(--text-2);
      line-height: 1.1;
      margin-bottom: 28px;
    }

    .q-body {
      font-size: 0.8rem;
      line-height: 1.85;
      color: var(--text);
      max-width: 720px;
    }

    .q-body p { margin-bottom: 18px; }
    .q-body p:last-child { margin-bottom: 0; }

    /* ── META GRID (inside q-block) ── */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 24px 32px;
      margin: 28px 0;
      padding: 24px;
      border: 1px solid var(--line);
      background: var(--gold-dim);
    }

    .meta-item-key {
      font-size: 0.52rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .meta-item-val {
      font-size: 0.75rem;
      color: var(--text-2);
      line-height: 1.4;
    }

    /* ── RISK ITEMS ── */
    .risk-list { margin-top: 8px; }

    .risk-item {
      margin-bottom: 22px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }
    .risk-item:last-child { border-bottom: none; margin-bottom: 0; }

    .risk-title {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 6px;
    }

    .risk-desc {
      font-size: 0.72rem;
      color: var(--muted-2);
      line-height: 1.75;
    }

    /* ── BLOCKQUOTE sintesi ── */
    .q-synthesis {
      border-left: 1px solid var(--gold-soft);
      padding-left: 28px;
      margin: 28px 0;
    }

    .q-synthesis p {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1rem, 1.6vw, 1.3rem);
      color: var(--text);
      line-height: 1.7;
      margin-bottom: 14px;
    }

    .q-synthesis p:last-child { margin-bottom: 0; }

    /* ── SCORE GRID ── */
    .score-section {
      padding: 48px 56px;
      border-bottom: 1px solid var(--line);
    }

    .score-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 1px;
      background: var(--line);
      margin-bottom: 40px;
    }

    .score-cell {
      background: var(--navy);
      padding: 24px 20px;
    }

    .score-cell-label {
      font-size: 0.52rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .score-cell-val {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.1rem;
      color: var(--muted-2);
      margin-bottom: 6px;
    }

    .score-cell-weight {
      font-size: 0.55rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    /* ── NEXT STEPS GRID ── */
    .next-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: var(--line);
    }

    .next-col {
      background: var(--navy-2);
      padding: 24px 20px;
    }

    .next-col-title {
      font-size: 0.52rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .next-item {
      font-size: 0.68rem;
      color: var(--muted-2);
      line-height: 1.6;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .next-item:last-child { border-bottom: none; margin-bottom: 0; }

    .next-item strong { color: var(--text); font-weight: 400; display: block; }

    /* ── AI ANALYSIS ── */
    .ai-section {
      padding: 40px 56px;
      border-top: 1px solid var(--line);
      background: var(--navy-2);
    }

    .ai-trigger {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .btn-ai {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--navy);
      background: var(--gold);
      border: none;
      padding: 10px 24px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-ai:hover { opacity: 0.85; }
    .btn-ai:disabled { opacity: 0.4; cursor: default; }

    .ai-note {
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .ai-result {
      display: none;
      margin-top: 24px;
    }

    .ai-result.visible { display: block; }

    .ai-result-label {
      font-size: 0.52rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }

    .ai-score-row {
      display: flex;
      gap: 32px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .ai-score-item { }
    .ai-score-key { font-size: 0.52rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    .ai-score-val { font-family: var(--serif); font-size: 1.6rem; color: var(--gold); }

    .ai-sintesi {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.1rem;
      color: var(--text);
      line-height: 1.7;
      border-left: 1px solid var(--gold-soft);
      padding-left: 20px;
      margin-top: 16px;
    }

    /* ── FOOTER ── */
    footer {
      padding: 28px 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.55rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      border-top: 1px solid var(--line);
    }
    footer a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--gold); }

    /* ── LOADING ── */
    .loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      flex-direction: column;
      gap: 16px;
    }
    .loading-ring {
      width: 28px; height: 28px;
      border: 1px solid var(--line);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .report-header { grid-template-columns: 1fr; gap: 6px; padding: 20px; }
      .rh-center, .rh-right { text-align: left; }
      .cover, .section-intro, .q-block, .score-section, .ai-section, nav, footer { padding-left: 20px; padding-right: 20px; }
      .score-grid { grid-template-columns: 1fr 1fr; }
      .next-grid { grid-template-columns: 1fr; }
      .cover-meta { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="app">

<script>
const SEED_URL  = 'data/operators_seed.json';
const GRAPH_URL = 'data/qen_graph_v4.json';
const API_BASE  = 'https://api.cognitivelogic.it';

const CLUSTER_CONTEXT = {

  balneare: {
    mercato: 'Demanio marittimo · Turismo balneare adriatico',

  },

    kpi_rilevanti: 'Certificazioni DOP/IGP, tracciabilità filiera, sostenibilità imballaggi (PPWR 2026)',
    rischio_primario: 'CSRD per PMI con catena di fornitura complessa, Green Claim su prodotto artigianale'
  }

function pad2(n) { return String(n).padStart(2,'0'); }

function daysTo(dateStr) {
  return Math.ceil((new Date(dateStr) - new Date()) / 864e5);
}

function today() {
  const d = new Date();
  return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`;
}

function buildReport(op, graphEdges) {
  const cc   = CLUSTER_CONTEXT[op.cluster]  || {};
  const sc   = SETTORE_CONTEXT[op.settore]  || {};
  const prioritaLabel = op.priorita === 1 ? 'Priorita 1 — Alta' : 'Priorita 2 — Media';
  const clusterLabel  = cc.label || op.cluster;

  // Edges for this operator from the graph
  const myEdges = graphEdges.filter(e => e.from === op.id || e.to === op.id);
  const edgesOut = myEdges.filter(e => e.from === op.id);
  const edgesIn  = myEdges.filter(e => e.to   === op.id);

  // Compliance analysis
  const complianceGaps = [];
  if (op.compliance.cin_cir  === 'N/V') complianceGaps.push('CIN/CIR');
  if (op.compliance.gdpr     === 'N/V') complianceGaps.push('GDPR');
  if (op.compliance.eu_ai_act=== 'N/V') complianceGaps.push('EU AI Act');

  // Risk items
  const risks = buildRisks(op, sc, complianceGaps);

  // Synthesis
  const synthesis = buildSynthesis(op, cc, sc);

  // Next steps
  const nextSteps  = buildNextSteps(op, complianceGaps);
  const nodiDaCrea = buildNodiDaCreare(op);
  const edgeAttesi = buildEdgeAttesi(op);

  return `
    <header class="report-header">
      <div class="rh-left">
        <strong>QEN — Quantum Ethics Network</strong>
        Report Strategico · ${clusterLabel}
      </div>
      <div class="rh-center">Cognitive Logic · cognitivelogic.it</div>
      <div class="rh-right">
        ${today()}<br>
        V1.0 · Seed Data
      </div>
    </header>

    <nav>
      <a href="index.html">Home</a>
      <a href="operatori.html">← Operatori</a>
      <a href="qen-live.html">QEN Live</a>
      <div class="nav-spacer"></div>
      <a href="operatori.html" class="nav-back">↩ Directory</a>
    </nav>

    <!-- COVER -->
    <section class="cover">
      <div class="cover-eyebrow">Report Strategico · ${prioritaLabel}</div>
      <h1 class="cover-title">
        ${op.label.split(' ').slice(0,2).join(' ')}<br>
        <em>${op.label.split(' ').slice(2).join(' ') || op.territorio}</em>
      </h1>
      <p class="cover-sub">${op.territorio} — Analisi Qualitativa degli Asset · QEN Framework</p>
      <div class="cover-meta">
        <div class="cover-meta-item">
          <div class="cover-meta-key">Cluster</div>
          <div class="cover-meta-val">${clusterLabel}</div>
        </div>
        <div class="cover-meta-item">
          <div class="cover-meta-key">Territorio</div>
          <div class="cover-meta-val">${op.territorio}</div>
        </div>
        <div class="cover-meta-item">
          <div class="cover-meta-key">Settore</div>
          <div class="cover-meta-val">${op.settore.charAt(0).toUpperCase() + op.settore.slice(1)}</div>
        </div>
        <div class="cover-meta-item">
          <div class="cover-meta-key">Stato QEN</div>
          <div class="cover-meta-val">${op.stato_qen.replace(/_/g,' ')}</div>
        </div>
        <div class="cover-meta-item">
          <div class="cover-meta-key">Nodo Graph</div>
          <div class="cover-meta-val" style="font-size:0.62rem;color:var(--muted)">${op.id}</div>
        </div>
        <div class="cover-meta-item">
          <div class="cover-meta-key">Edge attivi</div>
          <div class="cover-meta-val">${myEdges.length}</div>
        </div>
      </div>
    </section>

    <!-- SECTION INTRO -->
    <section class="section-intro">
      <div class="section-tag">Sezione 1 · QEN Framework</div>
      <h2>Qualitative Analysis<br><em>Il Valore degli Asset</em></h2>
      <p class="section-topics">Identita · Posizionamento · Compliance · Normativa · Radicamento · Segnali di Rischio · Lettura Semantica</p>
    </section>

    <!-- Q.1.01 -->
    <div class="q-block">
      <div class="q-label">Q.1.01 · Asset Primario</div>
      <h2 class="q-heading">Identita &amp; Capitale Storico</h2>
      <div class="meta-grid">
        <div>
          <div class="meta-item-key">Denominazione</div>
          <div class="meta-item-val">${op.label}</div>
        </div>
        <div>
          <div class="meta-item-key">Territorio</div>
          <div class="meta-item-val">${op.territorio}</div>
        </div>
        <div>
          <div class="meta-item-key">Settore</div>
          <div class="meta-item-val">${op.settore.charAt(0).toUpperCase() + op.settore.slice(1)}</div>
        </div>
        <div>
          <div class="meta-item-key">Anno fondazione</div>
          <div class="meta-item-val">N/V — da verificare</div>
        </div>
        <div>
          <div class="meta-item-key">Tipologia gestione</div>
          <div class="meta-item-val">N/V — da verificare</div>
        </div>
        <div>
          <div class="meta-item-key">Mercato di riferimento</div>
          <div class="meta-item-val">${sc.mercato || 'N/V'}</div>
        </div>
      </div>
      <div class="q-body">
        <p>L'operatore ${op.label} e' attivo nel settore ${op.settore} con sede a ${op.territorio}. Il profilo anagrafico completo — anno di fondazione, forma giuridica, titolare o gruppo proprietario — e' al momento non verificato e costituisce il primo obiettivo della fase di mappatura QEN.</p>
        <p>Il nodo semantico identificato nel grafo QEN e' <strong>${op.id}</strong>, di tipo @Gruppo. La fase di approfondimento prevede la scomposizione in nodi figlio: strutture operative (@Struttura), eventuali persone chiave (@Persona), sistemi gestionali (@PMS) e relazioni territoriali documentate.</p>
      </div>
    </div>

    <!-- Q.1.02 -->
    <div class="q-block">
      <div class="q-label">Q.1.02 · Posizionamento</div>

          <div class="meta-item-key">EU AI Act</div>

        <p>Gap identificati: <strong>${complianceGaps.join(', ')}</strong>. La verifica di questi parametri costituisce la priorita immediata della Fase 2 di mappatura. Per il calcolo del QEN Score, la compliance documentata su tutti i parametri e' un moltiplicatore diretto del vettore Vs.</p>

    <!-- Q.1.04 -->
    <div class="q-block">
      <div class="q-label">Q.1.04 · Normativa Applicabile</div>
      <h2 class="q-heading">Regolamenti &amp; Obblighi</h2>
      <div class="q-body">
        <p>Sulla base del cluster di appartenenza (<strong>${op.cluster}</strong>) e del settore operativo (<strong>${op.settore}</strong>), i regolamenti applicabili identificati sono:</p>
      </div>
      <div class="meta-grid" style="margin-top:20px">
        ${(cc.regolamenti || []).map((r,i) => `

          <div class="meta-item-key">Reg. ${pad2(i+1)}</div>
          <div class="meta-item-val">${r}</div>
        </div>

      </div>
      ${op.settore === 'alberghiero' ? `
      <div class="q-body" style="margin-top:20px">
        <p><strong>EU AI Act Allegato III</strong>: se l'operatore utilizza un PMS con profilazione ospiti, revenue management dinamico o channel manager integrati, il sistema potrebbe rientrare nell'Allegato III del Regolamento UE 2024/1689. La verifica del PMS e' priorita della Fase 2.</p>
      </div>
      ` : ''}
      ${op.settore === 'balneare' ? `
      <div class="q-body" style="margin-top:20px">
        <p><strong>Direttiva Bolkestein (2006/123/CE)</strong>: la scadenza delle concessioni demaniali marittime al 31 dicembre 2027 richiede la documentazione del valore aziendale ai fini della gara pubblica. Il Dossier QEN e' lo strumento previsto dal framework per questa finalita'.</p>
        <p><strong>Green Claim Directive (UE 2024/825)</strong>: in vigore dal settembre 2026. Qualsiasi affermazione ambientale nelle comunicazioni commerciali deve essere verificata da terzi. Il QEN Score fornisce la base computabile per certificare i green claim.</p>
      </div>
      ` : ''}
    </div>

    <!-- Q.1.05 -->
    <div class="q-block">
      <div class="q-label">Q.1.05 · Radicamento</div>
      <h2 class="q-heading">Territorio &amp; Ecosistema Locale</h2>
      <div class="q-body">
        <p>L'operatore e' localizzato a <strong>${op.territorio}</strong>, territorio che nel grafo QEN e' collegato al cluster <strong>${op.cluster}</strong>. Il radicamento territoriale e' uno dei fattori che alimentano il vettore Vt (Territoriale, peso 0.25) nel calcolo del QEN Score.</p>
        <p>Gli indicatori Vt rilevanti — anni di presenza nel territorio, percentuale fornitori locali verificati, partecipazione a reti territoriali, innovazione digitale — sono al momento non verificati e richiederanno raccolta dati diretta nella fase di audit.</p>
      </div>
      <div class="meta-grid" style="margin-top:20px">
        <div>
          <div class="meta-item-key">Comune / Area</div>
          <div class="meta-item-val">${op.territorio}</div>
        </div>
        <div>
          <div class="meta-item-key">Edge territoriali attivi</div>
          <div class="meta-item-val">${edgesOut.filter(e => e.to === 'RIVIERA_ADRIATICA_BALNEARI' || e.to === 'SETTORE_HORECA_BOLOGNA' || e.to === 'SETTORE_ARTIGIANATO_BOLOGNA' || e.to === 'SETTORE_RISTORAZIONE').length}</div>
        </div>
        <div>
          <div class="meta-item-key">Filiera km0</div>
          <div class="meta-item-val">N/V — da verificare</div>
        </div>
        <div>
          <div class="meta-item-key">Reti associative</div>
          <div class="meta-item-val">${op.cna_potenziale ? 'CNA Bologna (potenziale)' : 'N/V'}</div>
        </div>

      ${myEdges.length > 0 ? `
      <div class="q-body" style="margin-top:20px">
        <p>Edge semantici presenti nel grafo (${myEdges.length} totali):</p>
        ${edgesOut.map(e => `<p style="color:var(--muted-2);font-size:0.68rem;margin-bottom:4px">→ <strong style="color:var(--text)">${e.to}</strong> · ${e.type}</p>`).join('')}
        ${edgesIn.map(e => `<p style="color:var(--muted-2);font-size:0.68rem;margin-bottom:4px">← <strong style="color:var(--text)">${e.from}</strong> · ${e.type}</p>`).join('')}
      </div>
      ` : ''}
    </div>

    <!-- Q.1.06 -->
    <div class="q-block">
      <div class="q-label">Q.1.06 · Segnali di Rischio</div>
      <h2 class="q-heading">Gap Identificati</h2>
      <p class="q-body" style="margin-bottom:24px">L'analisi qualitativa a partire dai dati seed evidenzia le seguenti aree critiche da monitorare nella mappatura QEN completa:</p>
      <div class="risk-list">
        ${risks.map(r => `
        <div class="risk-item">
          <div class="risk-title">${r.title}</div>
          <div class="risk-desc">${r.desc}</div>
        </div>
        `).join('')}
      </div>
    </div>

    <!-- Q.1.07 -->
    <div class="q-block">
      <div class="q-label">Q.1.07 · Lettura Semantica</div>
      <h2 class="q-heading">Il Valore Complessivo degli Asset —<br>Lettura Semantica</h2>
      <div class="q-synthesis">
        ${synthesis}
      </div>
      <div class="q-body" style="margin-top:24px">
        <p>Nel paradigma QEN, questo non e' un profilo incompleto: e' <strong>capitale semantico comprimibile in nodi</strong>, edge verificabili e score calcolabili. La sfida e' tradurre la presenza territoriale e il radicamento storico dell'operatore in metriche Vs/Va/Vt difendibili davanti a un interlocutore normativo, commerciale o finanziario.</p>
      </div>
    </div>

    <!-- SCORE GRID -->
    <section class="score-section">
      <div class="q-label" style="margin-bottom:20px">Score QEN · Stato Attuale</div>
      <div class="score-grid">
        <div class="score-cell">
          <div class="score-cell-label">Vs · Sociale</div>
          <div class="score-cell-val">N/V</div>
          <div class="score-cell-weight">peso &times; 0.40</div>
        </div>
        <div class="score-cell">
          <div class="score-cell-label">Va · Ambientale</div>
          <div class="score-cell-val">N/V</div>
          <div class="score-cell-weight">peso &times; 0.35</div>
        </div>
        <div class="score-cell">
          <div class="score-cell-label">Vt · Territoriale</div>
          <div class="score-cell-val">${op.cluster === 'bolkestein' || op.priorita === 1 ? 'stima alta' : 'N/V'}</div>
          <div class="score-cell-weight">peso &times; 0.25</div>
        </div>
        <div class="score-cell">
          <div class="score-cell-label">QEN Score</div>

      <div class="next-grid">
        <div class="next-col">
          <div class="next-col-title">Prossimi Passi · Fase 2</div>
          ${nextSteps.map(s => `<div class="next-item">${s}</div>`).join('')}
        </div>
        <div class="next-col">
          <div class="next-col-title">Nodi QEN da Creare</div>
          ${nodiDaCrea.map(n => `<div class="next-item"><strong>${n.label}</strong>${n.desc}</div>`).join('')}
        </div>
        <div class="next-col">
          <div class="next-col-title">Edge Semantici Attesi</div>
          ${edgeAttesi.map(e => `<div class="next-item"><strong>${e.label}</strong>${e.desc}</div>`).join('')}
        </div>
      </div>
    </section>

    <!-- AI ANALYSIS -->
    <section class="ai-section">
      <div class="q-label" style="margin-bottom:12px">Analisi QEN · Stima Preliminare AI</div>
      <div class="ai-trigger">
        <button class="btn-ai" id="btn-ai" onclick="requestAI()">Genera Analisi QEN</button>

      </div>

        <div class="ai-result-label">Stima Preliminare · QEN Score Computato</div>

          <div class="ai-score-item"><div class="ai-score-key">Vs</div><div class="ai-score-val" id="ai-vs">—</div></div>
          <div class="ai-score-item"><div class="ai-score-key">Va</div><div class="ai-score-val" id="ai-va">—</div></div>
          <div class="ai-score-item"><div class="ai-score-key">Vt</div><div class="ai-score-val" id="ai-vt">—</div></div>
          <div class="ai-score-item"><div class="ai-score-key">QEN Score</div><div class="ai-score-val" id="ai-qen" style="font-size:2rem">—</div></div>
        </div>
        <div class="ai-sintesi" id="ai-sintesi">—</div>
      </div>
    </section>

    <footer>
      <span>© 2026 Roberto Bob Malini — Cognitive Logic · QEN Framework v6.0</span>
      <span><a href="operatori.html">Directory</a> · <a href="qen-live.html">Grafo Live</a> · <a href="copilot.html">Copilot</a></span>
    </footer>
  `;
}

function buildRisks(op, sc, gaps) {
  const risks = [];

  if (gaps.includes('CIN/CIR')) {
    risks.push({
      title: 'CIN/CIR non verificati.',
      desc: 'I codici identificativi nazionali delle strutture ricettive non sono stati verificati. Per gli operatori alberghieri e balneari con funzione ricettiva, la mancata registrazione CIN/CIR implica sanzioni amministrative e incide direttamente sul vettore Vs del QEN Score.'
    });
  }

  if (op.cluster === 'bolkestein' && op.compliance.bolkestein === 'soggetto') {
    risks.push({
      title: 'Scadenza concessione Bolkestein 2027.',
      desc: `Mancano ${daysTo('2027-12-31')} giorni alla scadenza delle concessioni demaniali. La gara pubblica obbligatoria richiede documentazione del valore aziendale storico ed etico. Senza un Dossier QEN certificato, l'operatore si presenta alla gara senza evidenza quantificabile del proprio valore territoriale.`
    });
  }

  if (sc.rischio_primario) {
    risks.push({
      title: 'Rischio normativo primario.',
      desc: sc.rischio_primario + ' Da investigare nella fase di mappatura QEN completa.'
    });
  }

  risks.push({
    title: 'Profilo digitale non mappato.',
    desc: 'Il livello di innovazione digitale, la presenza online verificabile e l\'identita\' digitale dell\'operatore non sono stati rilevati. Questo impatta il KPI "digitale" del vettore Vt (peso 0.10 su Vt).'
  });

  risks.push({
    title: 'Filiera fornitori non documentata.',
    desc: 'La percentuale di approvvigionamenti entro 100km (km0) e la tracciabilita\' dei fornitori locali non sono verificate. Il KPI "km0" ha peso 0.20 nel vettore Va — gap rilevante per Green Claim e CSRD.'
  });

  return risks;
}

function buildSynthesis(op, cc, sc) {
  if (op.cluster === 'bolkestein') {
    return `<p>${op.label} incarna una delle categorie a massima urgenza normativa del panorama italiano: quella degli operatori balneari adriatici che entro il 2027 dovranno dimostrare — davanti a una commissione pubblica — il valore storico, etico e territoriale di una presenza che in molti casi risale a decenni.</p>
    <p>Nel paradigma QEN, questa urgenza e' un'opportunita': la direttiva Bolkestein non chiede solo conformita', chiede <em>narrazione verificabile</em>. Il QEN Score e' la struttura computazionale che converte quella narrazione in evidenza difendibile.</p>`;
  }
  if (op.cluster === 'horeca_bologna') {
    return `<p>${op.label} opera in uno dei contesti HoReCa piu' ricchi di capitale semantico d'Italia: l'area metropolitana bolognese, dove la tradizione culinaria DOP, la filiera corta emiliana e la densita' artigianale costituiscono un vantaggio competitivo raramente documentato in forma computabile.</p>
    <p>Il QEN Framework permette di tradurre questo capitale intangibile in metriche Vs/Va/Vt difendibili — utili per candidature a bandi, partnership con CNA Bologna e posizionamento ESG verso i clienti.</p>`;
  }
  return `<p>${op.label} e' un operatore della provincia bolognese con potenziale di associazione CNA e profilo adatto alla certificazione QEN. Il valore dell'artigianato locale, della filiera corta e del radicamento territoriale e' la materia prima su cui il framework costruisce lo score.</p>
  <p>La sfida e' la stessa per tutti i 16.000 associati CNA Bologna: rendere visibile e misurabile cio' che finora era solo vissuto. Il QEN Score e' lo strumento.</p>`;
}

function buildNextSteps(op, gaps) {
  const steps = [];
  if (op.settore === 'alberghiero' || op.settore === 'misto') {
    steps.push('Verifica CIN/CIR tutte le strutture');
    steps.push('Identificazione PMS in uso');
  }
  if (op.cluster === 'bolkestein') {
    steps.push('Crawl sito / profilo digitale');
    steps.push('Verifica titolarita\' concessione');
    steps.push('Raccolta dati KPI balneare (M1-M6)');
  } else if (op.cluster === 'horeca_bologna') {
    steps.push('Audit QEN HoReCa (8 moduli)');
    steps.push('Verifica filiera km0');
    steps.push('Raccolta dati lavoro e welfare');
  } else {
    steps.push('Contatto CNA Bologna');
    steps.push('Audit ECI Assessment');
    steps.push('Verifica certificazioni prodotto');
  }
  return steps.slice(0, 4);
}

function buildNodiDaCreare(op) {
  const nodi = [
    { label: `@Gruppo ${op.label}`, desc: ' (hub)' },
  ];
  if (op.settore === 'alberghiero' || op.settore === 'balneare') {
    nodi.push({ label: '@Struttura principale', desc: ' (da identificare)' });
    nodi.push({ label: '@Persona titolare', desc: ' (proprieta\')' });
  }
  if (op.settore === 'alberghiero') {
    nodi.push({ label: '@PMS sistema', desc: ' (da verificare)' });
  }
  if (op.settore === 'balneare') {
    nodi.push({ label: '@Concessione demaniale', desc: ' (numero/scadenza)' });
  }
  if (op.settore === 'misto' || op.settore === 'ristorativo') {
    nodi.push({ label: '@Prodotto / certificazione', desc: ' (DOP/IGP/artigianale)' });
  }
  return nodi.slice(0, 4);
}

function buildEdgeAttesi(op) {
  const edges = [
    { label: 'Gruppo → Strutture', desc: ' (1+ nodi)' },
  ];
  if (op.compliance.cin_cir === 'N/V') {
    edges.push({ label: 'Strutture → CIN/CIR', desc: ' (compliance)' });
  }
  if (op.cluster === 'bolkestein') {
    edges.push({ label: 'Strutture → Concessione', desc: ' (demanio)' });
    edges.push({ label: 'Hub → Comune', desc: ' (territorio)' });
  }
  if (op.cluster === 'horeca_bologna' || op.cluster === 'cna_bologna') {
    edges.push({ label: 'Strutture → Filiera', desc: ' (km0)' });
    edges.push({ label: 'Hub → Territorio BO', desc: ' (radicamento)' });
  }
  if (op.cna_potenziale) {
    edges.push({ label: 'Operatore → CNA_BOLOGNA', desc: ' (associazione)' });
  }
  return edges.slice(0, 4);
}

async function requestAI() {
  const btn = document.getElementById('btn-ai');
  btn.disabled = true;
  btn.textContent = 'Analisi in corso…';

  const params = new URLSearchParams(window.location.search);
  const id     = params.get('id');

  try {
    const resp = await fetch(SEED_URL);
    const ops  = await resp.json();
    const op   = ops.find(o => o.id === id);
    if (!op) throw new Error('operatore non trovato');

    const desc = `Operatore ${op.settore} denominato "${op.label}", localizzato a ${op.territorio}. Cluster: ${op.cluster}. ${op.bolkestein_flag ? 'Soggetto a direttiva Bolkestein 2027.' : ''} ${op.cna_potenziale ? 'Potenziale associato CNA Bologna.' : ''} Compliance: tutti i parametri N/V.`;

    const r = await fetch(`${API_BASE}/gemini/qen-score`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Origin': 'https://cognitivelogic.it' },
      body: JSON.stringify({ business_name: op.label, sector: op.settore, description: desc })
    });

    if (!r.ok) throw new Error('API error');
    const data = await r.json();
    const q    = data.qen || {};

    document.getElementById('ai-vs').textContent  = q.vs   != null ? q.vs.toFixed(1)  : '—';
    document.getElementById('ai-va').textContent  = q.va   != null ? q.va.toFixed(1)  : '—';
    document.getElementById('ai-vt').textContent  = q.vt   != null ? q.vt.toFixed(1)  : '—';
    document.getElementById('ai-qen').textContent = q.qen_score != null ? q.qen_score.toFixed(1) : '—';
    document.getElementById('ai-sintesi').textContent = q.sintesi || '—';
    document.getElementById('ai-result').classList.add('visible');

    btn.textContent = 'Analisi completata';
  } catch(e) {
    btn.textContent = 'Errore — riprova';
    btn.disabled = false;
    console.error(e);
  }
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const id     = params.get('id');

  if (!id) {
    document.getElementById('app').innerHTML = `
      <div style="padding:80px 56px;text-align:center">
        <p style="color:var(--muted);font-size:0.8rem;margin-bottom:16px">Nessun operatore specificato.</p>
        <a href="operatori.html" style="color:var(--gold);font-size:0.7rem;letter-spacing:0.1em">← Torna alla directory</a>
      </div>`;
    return;
  }

  const [seedResp, graphResp] = await Promise.all([
    fetch(SEED_URL),
    fetch(GRAPH_URL)
  ]);

  const ops   = await seedResp.json();
  const graph = await graphResp.json();
  const op    = ops.find(o => o.id === id);

  if (!op) {
    document.getElementById('app').innerHTML = `
      <div style="padding:80px 56px;text-align:center">
        <p style="color:var(--muted);font-size:0.8rem;margin-bottom:16px">Operatore non trovato: <code>${id}</code></p>
        <a href="operatori.html" style="color:var(--gold);font-size:0.7rem;letter-spacing:0.1em">← Torna alla directory</a>
      </div>`;
    return;
  }

  // Update page title and meta
  document.title = `${op.label} — Report QEN · Cognitive Logic`;
  document.querySelector('meta[name="description"]').content =
    `Report QEN ${op.label} — ${op.territorio} · ${op.settore} · Analisi Qualitativa degli Asset · QEN Framework`;

  document.getElementById('app').innerHTML = buildReport(op, graph.edges || []);
}

init();
</script>
