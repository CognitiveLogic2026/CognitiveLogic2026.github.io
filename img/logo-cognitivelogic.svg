<svg width="268" height="64" viewBox="0 0 268 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#00ccff"/>
      <stop offset="16%" stop-color="#aa44ff"/>
      <stop offset="33%" stop-color="#ff44bb"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="67%" stop-color="#00ddbb"/>
      <stop offset="83%" stop-color="#4488ff"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
  </defs>

  <!-- LEFT: C / bracket shape (opens to the right) -->
  <!-- vertical spine -->
  <rect x="4"  y="4"  width="9" height="56" rx="4.5" fill="url(#holo)"/>
  <!-- top arm -->
  <rect x="4"  y="4"  width="27" height="9" rx="4.5" fill="url(#holo)"/>
  <!-- bottom arm -->
  <rect x="4"  y="51" width="27" height="9" rx="4.5" fill="url(#holo)"/>

  <!-- CENTER: vertical separator bar -->
  <rect x="37" y="4"  width="9" height="56" rx="4.5" fill="url(#holo)"/>

  <!-- RIGHT: E shape — three horizontal bars extending from center bar -->
  <!-- top bar -->
  <rect x="37" y="4"  width="26" height="9" rx="4.5" fill="url(#holo)"/>
  <!-- middle bar -->
  <rect x="37" y="27" width="26" height="9" rx="4.5" fill="url(#holo)"/>
  <!-- bottom bar -->
  <rect x="37" y="51" width="26" height="9" rx="4.5" fill="url(#holo)"/>

  <!-- Sparkle / lens-flare highlight (top-right of mark) -->
  <g transform="translate(57,11)" opacity="0.92">
    <line x1="-7" y1="0"  x2="7"  y2="0"  stroke="white" stroke-width="1.6"/>
    <line x1="0"  y1="-7" x2="0"  y2="7"  stroke="white" stroke-width="1.6"/>
    <line x1="-5" y1="-5" x2="5"  y2="5"  stroke="white" stroke-width="0.9"/>
    <line x1="5"  y1="-5" x2="-5" y2="5"  stroke="white" stroke-width="0.9"/>
    <circle cx="0" cy="0" r="2.5" fill="white"/>
  </g>

  <!-- "CognitiveLogic" wordmark -->
  <text
    x="76" y="43"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="500"
    font-size="22"
    letter-spacing="0.4"
    fill="url(#holo)"
  >CognitiveLogic</text>
</svg>
