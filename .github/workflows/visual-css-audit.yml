name: Visual CSS Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Test Digital Presence CSS patch
        run: node tests/visual/check-digital-presence.mjs

      - name: Run visual audit
        run: node tests/visual/audit.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-css-report
          path: visual-report/
          if-no-files-found: warn
          retention-days: 14
