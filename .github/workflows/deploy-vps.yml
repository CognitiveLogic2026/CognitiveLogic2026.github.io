name: Deploy QEN API to VPS
# also fires when deploy-static.yml is added/modified

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'orchestrator.py'
      - 'requirements-flask.txt'
      - 'qen-reconciliation/**'
      - 'nginx/**'
      - 'data/intelligence_feed.json'
      - 'data/qen_graph_v4.json'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy su VPS Hetzner
        uses: appleboy/ssh-action@v1.0.3
        env:
          ICEA_API_KEY: ${{ secrets.ICEA_API_KEY }}
          INFOCAMERE_API_KEY: ${{ secrets.INFOCAMERE_API_KEY }}
          SUPERVISOR_KEY: ${{ secrets.SUPERVISOR_KEY }}
          COGNITIVE_API_KEY: ${{ secrets.COGNITIVE_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          envs: ICEA_API_KEY,INFOCAMERE_API_KEY,SUPERVISOR_KEY,COGNITIVE_API_KEY,GOOGLE_PLACES_API_KEY,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,ALERT_EMAIL_FROM,ALERT_EMAIL_TO
          script: |
            set -e
            # accept-new: trusts first connection, rejects changed keys (blocks MITM)
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy -o StrictHostKeyChecking=accept-new"
            REPO_URL="git@github.com:CognitiveLogic2026/CognitiveLogic2026.github.io.git"
            REPO_DIR="/app/cognitivelogic"

            # Allow root to operate on a www-data-owned repo (set by systemd User=www-data)
            git config --global --add safe.directory "$REPO_DIR"

            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git remote set-url origin "$REPO_URL" 2>/dev/null || git remote add origin "$REPO_URL"
              git remote prune origin 2>/dev/null || true
              git fetch --prune origin
              git reset --hard origin/main
            else
              mkdir -p "$REPO_DIR"
              git clone "$REPO_URL" "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            VENV="/app/cognitivelogic/venv"
            [ -d "$VENV" ] || python3 -m venv "$VENV"
            "$VENV/bin/pip" install -q -r qen-reconciliation/requirements.txt
            "$VENV/bin/pip" install -q -r requirements-flask.txt

            # Initialize data files if missing
            [ -f /app/cognitivelogic/pilots.json ] || echo '{}' > /app/cognitivelogic/pilots.json
            # Sync knowledge graph from repo (always overwrite — repo is source of truth)
            cp "$REPO_DIR/data/qen_graph_v4.json" /app/cognitivelogic/graph.json

            # Ensure Redis is installed and running (needed for rate limiter)
            if ! command -v redis-server &>/dev/null; then
              apt-get install -y redis-server
            fi
            systemctl enable redis-server
            systemctl start redis-server || true

            # Write environment file (secrets never appear in service unit plaintext)
            mkdir -p /etc/cognitivelogic
            printf '%s=%s\n' \
              ICEA_API_KEY          "${ICEA_API_KEY}" \
              INFOCAMERE_API_KEY    "${INFOCAMERE_API_KEY}" \
              SUPERVISOR_KEY        "${SUPERVISOR_KEY}" \
              COGNITIVE_API_KEY     "${COGNITIVE_API_KEY}" \
              GOOGLE_PLACES_API_KEY "${GOOGLE_PLACES_API_KEY}" \
              REDIS_URL             "redis://localhost:6379" \
              SMTP_HOST             "${SMTP_HOST}" \
              SMTP_PORT             "${SMTP_PORT:-465}" \
              SMTP_USER             "${SMTP_USER}" \
              SMTP_PASS             "${SMTP_PASS}" \
              ALERT_EMAIL_FROM      "${ALERT_EMAIL_FROM}" \
              ALERT_EMAIL_TO        "${ALERT_EMAIL_TO}" \
              > /etc/cognitivelogic/env
            chmod 600 /etc/cognitivelogic/env

            # FastAPI QEN Reconciliation (porta 8001)
            cat > /etc/systemd/system/cognitivelogic.service << 'SVCEOF'
            [Unit]
            Description=CognitiveLogic QEN Reconciliation API
            After=network.target

            [Service]
            Type=simple
            User=www-data
            WorkingDirectory=/app/cognitivelogic/qen-reconciliation
            EnvironmentFile=/etc/cognitivelogic/env
            ExecStart=/app/cognitivelogic/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8001
            Restart=on-failure
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            # Flask service (porta 5000)
            cat > /etc/systemd/system/cognitivelogic-flask.service << 'FLASKSVCEOF'
            [Unit]
            Description=CognitiveLogic QEN Flask API
            After=network.target

            [Service]
            Type=simple
            User=www-data
            WorkingDirectory=/app/cognitivelogic
            EnvironmentFile=/etc/cognitivelogic/env
            ExecStart=/app/cognitivelogic/venv/bin/gunicorn main:app --bind 127.0.0.1:5000 --workers 2 --timeout 120
            Restart=on-failure
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            FLASKSVCEOF

            # Assicura che www-data abbia accesso alle directory necessarie
            chown -R www-data:www-data /app/cognitivelogic
            chown www-data:www-data /etc/cognitivelogic/env

            systemctl daemon-reload
            systemctl enable cognitivelogic && systemctl restart cognitivelogic
            systemctl enable cognitivelogic-flask && systemctl restart cognitivelogic-flask

            # Deploy nginx config from repo (human-readable, no base64)
            API_CONF="/etc/nginx/sites-available/api.cognitivelogic.it"
            cp "$REPO_DIR/nginx/api.cognitivelogic.it.conf" "$API_CONF"
            ln -sf "$API_CONF" /etc/nginx/sites-enabled/api.cognitivelogic.it 2>/dev/null || true
            nginx -t 2>&1 && systemctl reload nginx && echo "nginx reloaded OK" || echo "WARN: nginx reload failed"

            sleep 5
            echo "=== Health checks ==="
            curl -sf http://localhost:8001/health && echo "Reconciliation (8001) OK" || { echo "ERRORE: Reconciliation (8001) non risponde"; exit 1; }
            curl -sf http://localhost:5000/health  && echo "Flask (5000) OK"          || { echo "ERRORE: Flask (5000) non risponde"; exit 1; }

            echo "=== nginx proxy_pass routes ==="
            nginx -T 2>&1 | grep -E "(proxy_pass|location )"

            echo "=== nginx error log (last 20) ==="
            tail -20 /var/log/nginx/api_error.log 2>/dev/null || echo "no nginx error log"

            echo "=== systemd cognitivelogic ==="
            systemctl status cognitivelogic --no-pager -l 2>&1 | tail -10
            echo "=== systemd cognitivelogic-flask ==="
            systemctl status cognitivelogic-flask --no-pager -l 2>&1 | tail -10
            echo "=== ports listening ==="
            ss -tlnp | grep -E "(8001|5000)" || echo "WARN: ports not found"
            echo "Deploy completato"
