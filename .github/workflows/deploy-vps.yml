name: Deploy QEN API to VPS

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'qen-reconciliation/**'
      - 'orchestrator.py'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy su VPS Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          script: |
            set -e
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy -o StrictHostKeyChecking=no"
            REPO_URL="git@github.com:CognitiveLogic2026/CognitiveLogic2026.github.io.git"
            REPO_DIR="/app/cognitivelogic"

            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git remote set-url origin "$REPO_URL" 2>/dev/null || git remote add origin "$REPO_URL"
              git fetch origin main
              git reset --hard origin/main
            else
              mkdir -p "$REPO_DIR"
              git clone "$REPO_URL" "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            VENV="/app/cognitivelogic/venv"
            [ -d "$VENV" ] || python3 -m venv "$VENV"
            "$VENV/bin/pip" install -q -r qen-reconciliation/requirements.txt

            printf '[Unit]\nDescription=CognitiveLogic QEN Reconciliation API\nAfter=network.target\n\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/app/cognitivelogic/qen-reconciliation\nExecStart=/app/cognitivelogic/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8001\nRestart=on-failure\nRestartSec=10\n\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/cognitivelogic.service

            systemctl daemon-reload
            systemctl restart cognitivelogic

            sleep 5
            HEALTH=$(curl -sf http://localhost:8001/health || echo "{}")
            echo "Health: $HEALTH"
            echo "Deploy completato"
