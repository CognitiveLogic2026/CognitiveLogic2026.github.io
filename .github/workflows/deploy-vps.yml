name: Deploy QEN API → VPS

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'qen-reconciliation/**'
      - 'orchestrator.py'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy su VPS Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: root
          key:      ${{ secrets.VPS_SSH_KEY }}
          timeout:  60s
          script: |
            set -e
            cd /app/cognitivelogic

            # Pull aggiornamenti da main
            git fetch origin main
            git reset --hard origin/main

            # Aggiorna dipendenze FastAPI reconciliation
            pip3 install -q -r qen-reconciliation/requirements.txt

            # Aggiorna dipendenze Flask principale (se presenti)
            [ -f requirements.txt ] && pip3 install -q -r requirements.txt || true

            # Riavvia il servizio
            systemctl restart cognitivelogic

            # Health check (attendi avvio)
            sleep 3
            curl -sf http://localhost:8001/health | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print('✅ FastAPI OK:', d['status'])"
            echo "✅ Deploy completato"
