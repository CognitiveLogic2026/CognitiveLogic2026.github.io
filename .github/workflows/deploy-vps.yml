name: Deploy QEN API to VPS

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'qen-reconciliation/**'
      - 'orchestrator.py'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy su VPS Hetzner
        uses: appleboy/ssh-action@v1.0.3
        env:
          ICEA_API_KEY: ${{ secrets.ICEA_API_KEY }}
          INFOCAMERE_API_KEY: ${{ secrets.INFOCAMERE_API_KEY }}
          SUPERVISOR_KEY: ${{ secrets.SUPERVISOR_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          envs: ICEA_API_KEY,INFOCAMERE_API_KEY,SUPERVISOR_KEY
          script: |
            set -e
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy -o StrictHostKeyChecking=no"
            REPO_URL="git@github.com:CognitiveLogic2026/CognitiveLogic2026.github.io.git"
            REPO_DIR="/app/cognitivelogic"

            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git remote set-url origin "$REPO_URL" 2>/dev/null || git remote add origin "$REPO_URL"
              git fetch origin main
              git reset --hard origin/main
            else
              mkdir -p "$REPO_DIR"
              git clone "$REPO_URL" "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            VENV="/app/cognitivelogic/venv"
            [ -d "$VENV" ] || python3 -m venv "$VENV"
            "$VENV/bin/pip" install -q -r qen-reconciliation/requirements.txt

            # Write environment file (secrets never appear in service unit plaintext)
            mkdir -p /etc/cognitivelogic
            cat > /etc/cognitivelogic/env << 'ENVEOF'
            ICEA_API_KEY=ICEA_PLACEHOLDER
            INFOCAMERE_API_KEY=INFOCAMERE_PLACEHOLDER
            SUPERVISOR_KEY=SUPERVISOR_PLACEHOLDER
            ENVEOF
            sed -i "s|ICEA_PLACEHOLDER|${ICEA_API_KEY}|" /etc/cognitivelogic/env
            sed -i "s|INFOCAMERE_PLACEHOLDER|${INFOCAMERE_API_KEY}|" /etc/cognitivelogic/env
            sed -i "s|SUPERVISOR_PLACEHOLDER|${SUPERVISOR_KEY}|" /etc/cognitivelogic/env
            chmod 600 /etc/cognitivelogic/env

            cat > /etc/systemd/system/cognitivelogic.service << 'SVCEOF'
            [Unit]
            Description=CognitiveLogic QEN Reconciliation API
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/app/cognitivelogic/qen-reconciliation
            EnvironmentFile=/etc/cognitivelogic/env
            ExecStart=/app/cognitivelogic/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8001
            Restart=on-failure
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            systemctl daemon-reload
            systemctl restart cognitivelogic

            # Fix nginx config for api.cognitivelogic.it → port 8001
            API_CONF="/etc/nginx/sites-available/api.cognitivelogic.it"
            if [ -f "$API_CONF" ]; then
              echo "=== api.cognitivelogic.it before ==="
              cat "$API_CONF"
              # Replace named upstream with direct proxy to port 8001
              sed -i 's|proxy_pass http://qen_api[^;]*;|proxy_pass http://127.0.0.1:8001;|g' "$API_CONF"
              # Update upstream block server line if present
              sed -i '/upstream qen_api/,/}/{s|server [0-9a-z.:]*;|server 127.0.0.1:8001;|}' "$API_CONF"
              echo "=== api.cognitivelogic.it after ==="
              cat "$API_CONF"
            else
              echo "WARN: $API_CONF not found"
              ls /etc/nginx/sites-available/ 2>/dev/null
            fi
            nginx -t 2>&1 && systemctl reload nginx && echo "nginx reloaded OK" || echo "WARN: nginx not reloaded"

            sleep 5
            HEALTH=$(curl -sf http://localhost:8001/health || echo "{}")
            echo "Health: $HEALTH"
            HEALTH_EXT=$(curl -sf https://api.cognitivelogic.it/health || echo "{}")
            echo "Health external: $HEALTH_EXT"

            # Nginx error logs for debugging 500s
            echo "=== nginx error log (last 30) ==="
            tail -30 /var/log/nginx/api_error.log 2>/dev/null || tail -30 /var/log/nginx/error.log 2>/dev/null || echo "no nginx error log found"
            echo "=== nginx access log (last 10) ==="
            tail -10 /var/log/nginx/api_access.log 2>/dev/null || tail -10 /var/log/nginx/access.log 2>/dev/null || echo "no nginx access log found"
            echo "=== systemd service status ==="
            systemctl status cognitivelogic --no-pager -l 2>&1 | tail -20
            echo "=== port 8001 listening ==="
            ss -tlnp | grep 8001 || echo "WARN: nothing on 8001"
            echo "Deploy completato"
