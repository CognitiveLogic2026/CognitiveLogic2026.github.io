name: Deploy Static Files to VPS

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'img/**'
      - 'data/**'
      - 'llms.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'ops/deploy-existing-public.sh'
      - 'ops/public-static-manifest.txt'
      - '.github/workflows/deploy-static.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest static files on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          script: |
            set -eu
            RELEASE_SHA='${{ github.sha }}'
            case "$RELEASE_SHA" in ''|*[!0-9a-f]*) exit 1 ;; esac
            [ "${#RELEASE_SHA}" -eq 40 ]
            REPO_URL=https://github.com/CognitiveLogic2026/CognitiveLogic2026.github.io.git
            PUBLIC_ROOT=/var/www/cognitivelogic-public
            WORK="$(mktemp -d /root/cognitive-editorial-staging/static-release.XXXXXXXX)"
            trap 'rm -rf -- "$WORK"' EXIT
            git init --quiet --template= "$WORK/source"
            git -C "$WORK/source" -c core.hooksPath=/dev/null fetch --quiet --depth=1 --no-tags "$REPO_URL" "$RELEASE_SHA"
            git -C "$WORK/source" -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD
            [ "$(git -C "$WORK/source" rev-parse HEAD)" = "$RELEASE_SHA" ]
            [ -d "$PUBLIC_ROOT" ] && [ ! -L "$PUBLIC_ROOT" ]
            bash "$WORK/source/ops/deploy-existing-public.sh" "$PUBLIC_ROOT"

concurrency:
  group: cognitive-logic-vps-deploy
  cancel-in-progress: false
