name: Deploy Static Files to VPS

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'img/**'
      - 'data/**'
      - 'llms.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/deploy-static.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest static files on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          script: |
            set -e
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy -o StrictHostKeyChecking=no"
            cd /app/cognitivelogic
            git fetch origin main
            git reset --hard origin/main

            PUBLIC_ROOT="/var/www/cognitivelogic-public"
            mkdir -p "$PUBLIC_ROOT"

            # Machine-readable public discovery files.
            # Keep this deployment deliberately explicit.
            install -m 0644 llms.txt "$PUBLIC_ROOT/llms.txt"
            install -m 0644 robots.txt "$PUBLIC_ROOT/robots.txt"
            install -m 0644 sitemap.xml "$PUBLIC_ROOT/sitemap.xml"

            mkdir -p "$PUBLIC_ROOT/international-watch"
            rsync -a --delete               international-watch/               "$PUBLIC_ROOT/international-watch/"

            echo "Machine-readable public files synchronized OK"
