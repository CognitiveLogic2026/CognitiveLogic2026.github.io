name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -q \
            -r requirements-flask.txt \
            -r requirements-test.txt \
            -r qen-reconciliation/requirements.txt \
            httpx

      - name: Run smoke tests
        run: |
          python scripts/build_source_index.py
          git diff --exit-code -- data/source-index.json
          pytest tests/ -v
