<svg width="4000" height="1200" viewBox="0 0 4000 1200" xmlns="http://www.w3.org/2000/svg">

  <!-- Rettangolo sinistro (30%) -->
  <rect x="0" y="200" width="1200" height="800"
        fill="none" stroke="#cfd2d4" stroke-width="80" />

  <!-- Rettangolo destro (70%) -->
  <rect x="1200" y="200" width="2800" height="800"
        fill="none" stroke="#cfd2d4" stroke-width="80" />

  <!-- I-beam al 30% (x = 1200) -->
  <line x1="1200" y1="200" x2="1200" y2="1000"
        stroke="#cfd2d4" stroke-width="120" stroke-linecap="round" />

  <!-- Testo principale -->
  <text x="1600" y="750"
        font-family="JetBrains Mono, monospace"
        font-size="500"
        font-weight="500"
        fill="#cfd2d4"
        text-anchor="start"
        letter-spacing="-12">
    CognitiveLogic
  </text>

  <!-- "Cog" inglobato nella parte destra -->
  <text x="3300" y="750"
        font-family="JetBrains Mono, monospace"
        font-size="420"
        font-weight="500"
        fill="#cfd2d4"
        text-anchor="middle"
        letter-spacing="-10">
    Cog
  </text>

</svg>
